<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中階個體經濟學 · 複習</title>
<style>
:root{
  --bg:#0f1115; --surface:#181b22; --surface2:#20242e; --line:#2b3040;
  --ink:#e8eaf0; --muted:#9aa3b5; --accent:#6ea8fe; --accent2:#f0b354;
  --good:#4ade80; --bad:#f87171; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.6}
body{padding-bottom:80px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:760px;margin:0 auto}
.htitle{font-size:16px;font-weight:700;letter-spacing:.3px}
.htitle small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}
.prog{margin-left:auto;font-size:12px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:6px;padding:10px 16px;max-width:760px;margin:0 auto;overflow-x:auto}
.tab{flex:0 0 auto;padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tab.on{background:var(--accent);color:#0b1020;border-color:var(--accent)}

/* chapter grid */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.chcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.chcard:hover,.chcard:active{border-color:var(--accent);transform:translateY(-2px)}
.chcard .n{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px}
.chcard .zh{font-size:15px;font-weight:700;margin-top:4px}
.chcard .en{font-size:11px;color:var(--muted);margin-top:2px}
.chcard .done{position:absolute;top:10px;right:10px;font-size:14px;opacity:0;transition:.2s}
.chcard.studied .done{opacity:1}

/* section */
h2.sec{font-size:14px;color:var(--accent2);margin:22px 0 10px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:3px;height:16px;background:var(--accent2);border-radius:2px}

/* summary/points */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.summary{font-size:15px;line-height:1.75}
.points{list-style:none}
.points li{padding:8px 0 8px 24px;position:relative;border-bottom:1px solid var(--line);font-size:14.5px}
.points li:last-child{border-bottom:none}
.points li::before{content:"▸";position:absolute;left:4px;color:var(--accent)}

/* terms */
.term{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.term .t{font-weight:700;font-size:15px}
.term .t .en{color:var(--accent);font-size:12px;font-weight:600;margin-left:6px}
.term .d{color:var(--muted);font-size:13.5px;margin-top:4px}

/* flashcard */
.fcwrap{perspective:1200px;margin-bottom:14px}
.fc{position:relative;width:100%;min-height:150px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fcface{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;border-radius:var(--radius);border:1px solid var(--line);font-size:16px}
.fcfront{background:var(--surface2)}
.fcback{background:linear-gradient(135deg,#243049,#1a2233);transform:rotateY(180deg);color:var(--ink)}
.fchint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.fcnav{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
.fcnav button{background:var(--surface);border:1px solid var(--line);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:18px;cursor:pointer}
.fcnav .count{font-size:13px;color:var(--muted);min-width:60px;text-align:center}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.q .qq{font-weight:700;font-size:15px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);color:var(--ink);padding:11px 14px;border-radius:10px;margin-bottom:8px;font-size:14px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.correct{background:rgba(74,222,128,.15);border-color:var(--good)}
.opt.wrong{background:rgba(248,113,113,.15);border-color:var(--bad)}
.opt.dim{opacity:.5}
.explain{font-size:13px;color:var(--muted);margin-top:8px;padding:10px;background:var(--surface2);border-radius:8px;display:none}
.explain.show{display:block}

/* back button */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:14px;cursor:pointer;margin:16px 0 4px;font-weight:600}

.hidden{display:none}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:24px 0}
.scoreBadge{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--accent2);margin-left:8px}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="htitle">中階個體經濟學 <small>Varian · 複習與記憶 · 黃貞穎</small></div>
    <a href="practice.html" style="margin-left:auto;font-size:12px;color:#6ea8fe;text-decoration:none;padding:6px 10px;border:1px solid #2b3040;border-radius:8px">✍️ 思考題</a><div class="prog" id="prog" style="margin-left:10px"></div>
  </div>
</header>

<!-- 首頁：章節列表 -->
<div id="home" class="wrap">
  <div class="chgrid" id="chgrid"></div>
  <div class="footer">忠於課文投影片內容 · 35 章 · 點章節開始複習</div>

<div id="detail" class="wrap hidden">

<script id="DATA" type="application/json">{"chapters": [{"num": 1, "title_en": "The Market", "title_zh": "市場", "summary": "本章以公寓（內環／外環）為例，說明市場如何用價格 p* 分配財貨：願意付高於 p* 的人住內環，其餘住外環。引入保留價格（reservation price）與需求／供給曲線，並比較不同配置方式（普通獨占、差別取價獨占、租金管制）。最後以 Pareto 效率（Pareto efficiency）作為評價配置好壞的核心概念，但它對分配公平問題保持沉默。", "key_terms": [{"term_en": "Reservation price", "term_zh": "保留價格", "def": "一個人對某物的最高願付價格（maximum willingness to pay）；也是讓消費者對於買或不買、住內環或外環感到無差異的價格。"}, {"term_en": "Pareto efficiency", "term_zh": "帕累托效率", "def": "若存在一種方法能讓某些人變好而不使任何人變差，即為帕累托改善（Pareto improvement）；若不存在任何帕累托改善的空間，配置便達到帕累托效率。此概念對分配問題保持沉默。"}, {"term_en": "Discriminating Monopolist (DM)", "term_zh": "差別取價獨占者", "def": "能對每位消費者完美地依其保留價格取價的單一賣者；其結果也是帕累托有效率的。"}, {"term_en": "Ordinary Monopolist (OM)", "term_zh": "普通獨占者", "def": "只能訂單一價格的單一賣者，故其最大化 p·D(p)，通常訂出高於 p* 的價格，僅保留價格高於該價的人能取得公寓。"}, {"term_en": "Rent Control (RC)", "term_zh": "租金管制", "def": "設定上限價 pmax，需 pmax < p* 才有效；此時我們無法確知誰能取得公寓，只知道取得者的保留價格至少為 pmax。"}], "key_points": ["市場機制以均衡價格 p* 分配公寓：願付高於 p* 者住內環，其餘住外環。", "在市場中交易的人都能獲得剩餘（surplus），包括消費者剩餘與生產者剩餘。", "在連續數量下，邊際上賣與不賣帶來相同利潤，這對應到生產者剩餘的概念。", "市場配置是帕累托有效率的；差別取價獨占者的配置同樣是帕累托有效率的。", "帕累托效率只談效率，對「誰得到、公不公平」等分配問題保持沉默。", "不同配置方式（DM、OM、租金管制）會導致不同的分配結果與效率性質。", "帕累托效率概念源自經濟學家兼社會學家 Vilfredo Pareto（1848–1923）。"], "flashcards": [{"q": "什麼是保留價格（reservation price）？", "a": "一個人對某物的最高願付價格，也是讓他對買或不買感到無差異的價格。"}, {"q": "市場均衡價格 p* 如何決定誰住內環？", "a": "願意付高於 p* 的人取得內環公寓，其餘人住外環。"}, {"q": "差別取價獨占者（DM）如何取價？結果的效率如何？", "a": "對每位消費者依其保留價格完美取價；其配置仍是帕累托有效率的。"}, {"q": "租金管制要「有效」需滿足什麼條件？其分配後果為何？", "a": "需 pmax < p*；此時無法確知誰得到公寓，只知道取得者的保留價格至少為 pmax。"}, {"q": "帕累托改善（Pareto improvement）的定義是什麼？", "a": "存在一種方法能讓某些人變好而不使任何人變差。"}], "quiz": [{"q": "下列何者最能描述帕累托效率（Pareto efficiency）的特性？", "options": ["它能保證資源分配公平", "它對分配問題保持沉默，只談效率", "只有完全競爭市場才可能達成", "它要求所有人得到相同數量"], "answer": 1, "explain": "帕累托效率只判斷是否還能在不損及他人下改善某些人，對公平分配不置一詞。"}, {"q": "保留價格（reservation price）指的是？", "options": ["賣方的最低要價", "市場均衡價格", "消費者的最高願付價格", "政府設定的價格上限"], "answer": 2, "explain": "保留價格是一個人對某物的最高願付價格，也是讓他無差異的價格。"}, {"q": "租金管制若要有效，價格上限 pmax 必須滿足？", "options": ["pmax > p*", "pmax = p*", "pmax < p*", "pmax 與 p* 無關"], "answer": 2, "explain": "只有當上限低於市場均衡價 p* 時，管制才會真正產生拘束力。"}, {"q": "關於差別取價獨占者（DM），下列敘述何者正確？", "options": ["它訂單一價格最大化利潤", "它的配置不是帕累托有效率的", "它依每位消費者的保留價格取價，且配置帕累托有效率", "它必須低於 p* 取價"], "answer": 2, "explain": "DM 能完美依保留價格取價，其配置與市場一樣是帕累托有效率的。"}]}, {"num": 2, "title_en": "Budget Constraint", "title_zh": "預算限制", "summary": "本章介紹預算限制（budget constraint）：p1·x1 + p2·x2 ≤ m，其中 m 為所得、(p1, p2) 為兩財價格。預算線斜率為 −p1/p2，代表多買一單位財貨 1 須放棄多少財貨 2。常以「兩財」分析即足夠，並可將財貨 2 視為代表所有其他支出的複合財（composite good）。重點結論：只有相對價格（實質）重要，絕對價格不重要；當所得與價格同比例變動時實質預算集不變（避免貨幣幻覺）。", "key_terms": [{"term_en": "Budget constraint", "term_zh": "預算限制", "def": "消費者可負擔的組合須滿足 p1·x1 + p2·x2 ≤ m，其中 m 為可支配所得，(p1, p2) 為兩財價格。"}, {"term_en": "Slope of budget line (−p1/p2)", "term_zh": "預算線斜率", "def": "斜率為 −p1/p2，意義為每增加一單位財貨 1，須減少多少單位財貨 2；例如 p1=6、p2=3 時斜率絕對值為 2。"}, {"term_en": "Composite good", "term_zh": "複合財", "def": "把財貨 2 設為「花在所有其他財貨上的錢」，即以一種複合財代表其餘所有支出，故兩財分析通常已足夠。"}, {"term_en": "Relative prices", "term_zh": "相對價格", "def": "只有相對價格（實質意義下）重要，絕對價格不重要；例如 m、p1、p2 同比例變動時預算集不變。"}, {"term_en": "Money illusion", "term_zh": "貨幣幻覺", "def": "誤把絕對（名目）價格或所得的變動當成實質變動；例如同比例的減薪與物價下降其實未必是真正的實質減薪。"}], "key_points": ["預算限制式：p1·x1 + p2·x2 ≤ m，m 為所得、(p1, p2) 為兩財價格。", "預算線斜率為 −p1/p2，代表多買一單位財貨 1 需放棄的財貨 2 數量（機會成本）。", "常把財貨 2 當成複合財（花在其他所有財貨上的錢），因此兩財分析通常足夠。", "所得或價格改變會使預算線平移或旋轉，改變可行的消費集合。", "只有相對價格重要，絕對價格不重要。", "m、p1、p2 同比例變動時，實質預算集不變；忽略此點即產生貨幣幻覺。", "若預算集變大，消費者（弱意義上）不會變差（weakly better off）。"], "flashcards": [{"q": "預算限制的數學式為何？各符號代表什麼？", "a": "p1·x1 + p2·x2 ≤ m；m 是所得，(p1, p2) 是兩財價格。"}, {"q": "預算線斜率 −p1/p2 的經濟意義是什麼？", "a": "每多買一單位財貨 1，須放棄的財貨 2 數量，即以財貨 2 衡量財貨 1 的機會成本。"}, {"q": "為什麼分析兩財通常就夠了？", "a": "可把財貨 2 設為複合財，代表花在所有其他財貨上的錢。"}, {"q": "當 m、p1、p2 同比例上升時，預算集會怎樣？", "a": "實質預算集不變，因為只有相對價格重要，絕對價格不重要。"}, {"q": "什麼是貨幣幻覺（money illusion）？", "a": "把名目（絕對）價格或所得的變動誤認為實質變動，例如以為同比例減薪就是真的變窮。"}], "quiz": [{"q": "若 p1=6、p2=3，則預算線斜率的絕對值為多少？其意義是？", "options": ["0.5；多買1單位財貨1須放棄0.5單位財貨2", "2；多買1單位財貨1須放棄2單位財貨2", "3；多買1單位財貨1須放棄3單位財貨2", "6；多買1單位財貨1須放棄6單位財貨2"], "answer": 1, "explain": "斜率絕對值 = p1/p2 = 6/3 = 2，代表每增加1單位財貨1須放棄2單位財貨2。"}, {"q": "關於絕對價格與相對價格，下列何者正確？", "options": ["絕對價格重要，相對價格不重要", "兩者同等重要", "只有相對價格重要，絕對價格不重要", "兩者都不重要"], "answer": 2, "explain": "本章強調只有相對價格（實質）重要，絕對價格不重要。"}, {"q": "把財貨 2 視為『花在所有其他財貨上的錢』，這種設定稱為？", "options": ["保留價格", "複合財（composite good）", "季芬財", "劣等財"], "answer": 1, "explain": "以一種複合財代表其餘所有支出，使兩財分析即足夠。"}, {"q": "若消費者的預算集變大，他的福利會如何？", "options": ["一定變差", "一定不變", "弱意義上不會變差（weakly better off）", "無法判斷方向"], "answer": 2, "explain": "預算集變大代表可選擇的組合更多，消費者至少不會更差。"}]}, {"num": 3, "title_en": "Preferences", "title_zh": "偏好", "summary": "本章說明消費者行為的核心是「在可負擔的範圍內選最好的」，而「最好」可用偏好（preferences）描述，不必動用效用概念。介紹幾個有用的偏好假設：單調性（monotonicity，多多益善，蘊含無異曲線斜率為負）與（嚴格）凸性（strict convexity）。並定義邊際替代率（MRS）：為了維持無差異，消費者願意用財貨 2 交換一點財貨 1 的比率。", "key_terms": [{"term_en": "Preferences", "term_zh": "偏好", "def": "描述消費者對不同消費組合的好惡排序；只用偏好即可刻畫選擇，不必先引入效用概念。"}, {"term_en": "Monotonicity", "term_zh": "單調性", "def": "多多益善：若一組合各財貨數量都不少於另一組合且至少有一項嚴格較多，則前者被嚴格偏好。此假設蘊含無異曲線斜率為負。"}, {"term_en": "Indifference curve", "term_zh": "無異曲線", "def": "帶來相同滿足（無差異）的消費組合所連成的曲線；在單調性下其斜率為負。"}, {"term_en": "Strict convexity", "term_zh": "嚴格凸性", "def": "比凸性更強的假設：若 y 與 z 皆弱優於 x 且兩者不同，則兩者間任意嚴格內插的組合（權重 t 介於 0 與 1 之間）都嚴格優於 x，代表偏好『混合』。"}, {"term_en": "Marginal Rate of Substitution (MRS)", "term_zh": "邊際替代率", "def": "消費者『剛好』願意以一物換另一物的比率；MRS(1,2) 指為了多得一點財貨 1、願意放棄的財貨 2 數量（維持無差異），須指明是哪換哪、在何處衡量。"}], "key_points": ["消費者的目標：在可負擔範圍內選『最好』的組合。", "刻畫『最好』只需偏好即可，不必先使用效用（utility）概念。", "單調性（多多益善）蘊含無異曲線的斜率為負。", "嚴格凸性比一般凸性更強，代表消費者偏好『混合』而非極端。", "MRS 衡量消費者剛好願意以一物替換另一物、維持無差異的比率。", "使用 MRS 時須指明是哪一財換哪一財，以及在哪一點衡量。"], "flashcards": [{"q": "描述消費者選擇一定要用效用嗎？", "a": "不必；只用偏好（preferences）就足以刻畫『選最好且可負擔』的行為。"}, {"q": "單調性（monotonicity）是什麼？它蘊含什麼？", "a": "多多益善（越多越好）；蘊含無異曲線的斜率為負。"}, {"q": "嚴格凸性（strict convexity）的直覺是什麼？", "a": "偏好『混合』：兩個弱優於 x 且不同的組合，其嚴格內插組合會嚴格優於 x。"}, {"q": "MRS(1,2) 的意義是什麼？", "a": "為了多得一點財貨 1、消費者願意放棄的財貨 2 數量，以維持無差異。"}, {"q": "使用 MRS 時要注意指明哪兩件事？", "a": "要指明是哪一財換哪一財，以及在哪一點（哪個組合）衡量。"}], "quiz": [{"q": "單調性（多多益善）的假設會導致無異曲線具有什麼性質？", "options": ["斜率為正", "斜率為負", "為水平線", "為垂直線"], "answer": 1, "explain": "在多多益善下，要維持無差異，多得一財就須少得另一財，故斜率為負。"}, {"q": "MRS(1,2) 衡量的是？", "options": ["財貨1的市場價格", "為維持無差異、多得一點財貨1願放棄的財貨2數量", "所得除以價格", "兩財的絕對價格差"], "answer": 1, "explain": "MRS 是消費者剛好願意以財貨2替換財貨1、維持無差異的比率。"}, {"q": "關於嚴格凸性（strict convexity），下列何者正確？", "options": ["它比凸性弱", "它與凸性等價", "它比凸性強，偏好混合勝於極端", "它代表偏好極端組合"], "answer": 2, "explain": "嚴格凸性比一般凸性更強，反映消費者偏好『混合』的組合。"}, {"q": "本章強調刻畫消費者選擇時？", "options": ["一定要先定義效用函數", "只需偏好即可，不必先用效用", "必須知道基數效用大小", "須先知道所有價格"], "answer": 1, "explain": "課文指出『偏好就夠了』，不需先引入效用概念。"}]}, {"num": 4, "title_en": "Utility", "title_zh": "效用", "summary": "本章以效用函數（utility function）作為偏好的數值指標：更被偏好的組合被賦予較大的數字。重點是我們只用效用的序數（ordinal）性質，任何保序的單調轉換（如 v=2u）都同樣好。MRS 可由邊際效用推得：MRS(1,2) = −MU1/MU2，且 MRS 不隨所用的效用函數改變。並介紹完全替代、完全互補、擬線性（quasilinear）等偏好，以及邊際效用（marginal utility）的定義。", "key_terms": [{"term_en": "Utility function", "term_zh": "效用函數", "def": "把數字指派給每個消費組合的方式，使更被偏好的組合得到較大數字，即 (x1,x2) 弱優於 (y1,y2) 若且唯若 u(x1,x2) ≥ u(y1,y2)。"}, {"term_en": "Ordinal vs Cardinal utility", "term_zh": "序數效用 vs 基數效用", "def": "序數效用只在意排序（第1、第2…），差距大小不重要；基數效用則在意效用的量值大小。本課只用序數性質。"}, {"term_en": "Monotonic transformation", "term_zh": "單調轉換", "def": "保序的轉換，如 v=2u 或 v=f(u)（f 遞增），u 與 v 代表同一組偏好、同樣好，因為它們對組合的排序一致。"}, {"term_en": "Marginal utility (MU)", "term_zh": "邊際效用", "def": "多消費一單位某財貨所引起的效用變化率，MU1 ≈ (u(x1+Δx1, x2) − u(x1, x2))/Δx1；其值取決於所用的效用函數，須指明在何處衡量。"}, {"term_en": "MRS via MU", "term_zh": "以邊際效用表示的 MRS", "def": "沿無異曲線 u=常數，有 MU1·Δx1 + MU2·Δx2 = 0，故 MRS(1,2) = −MU1/MU2；MU 依效用函數而變，但 MRS 不變。"}, {"term_en": "Quasilinear preferences", "term_zh": "擬線性偏好", "def": "形如 u(x1,x2)=v(x1)+x2，其中 v(·) 為凹函數（如 v=√x1 或 v=ln x1）；對財貨 2 為線性。"}], "key_points": ["效用函數把數字指派給組合，使更被偏好者得較大數字；我們只用它的序數性質。", "任何保序的單調轉換（如 v=2u、v=f(u)）代表同一偏好，同樣好。", "邊際效用 MU 是多消費一單位某財所引起的效用變化率，會隨所用效用函數不同而不同。", "沿無異曲線 MU1·Δx1 + MU2·Δx2 = 0，推得 MRS(1,2) = −MU1/MU2。", "MRS 不隨所用的效用函數改變（是偏好的性質，與效用的基數表示無關）。", "完全替代偏好如 u=a·x1+b·x2 型，MRS 為常數 −b/a；也有完全互補與擬線性等常見型態。", "擬線性偏好 u=v(x1)+x2，v 為凹函數（如 √x1 或 ln x1）。"], "flashcards": [{"q": "效用函數的定義是什麼？", "a": "把數字指派給每個消費組合，使更被偏好者得較大數字，即 u(x1,x2) ≥ u(y1,y2) 恰對應偏好排序。"}, {"q": "序數效用與基數效用差在哪？本課用哪一種？", "a": "序數只在意排序、差距大小不重要；基數在意量值。本課只用序數性質。"}, {"q": "為什麼 v=2u 與 u 一樣好？", "a": "因為它是保序的單調轉換，對所有組合的排序完全一致，代表同一組偏好。"}, {"q": "MRS 如何用邊際效用表示？", "a": "MRS(1,2) = −MU1/MU2，由沿無異曲線 MU1·Δx1 + MU2·Δx2 = 0 推得。"}, {"q": "MU 與 MRS，哪個會隨效用函數改變、哪個不會？", "a": "MU 會隨所用效用函數改變；MRS 不會改變。"}, {"q": "擬線性偏好（quasilinear）的一般形式為何？", "a": "u(x1,x2)=v(x1)+x2，其中 v(·) 為凹函數，如 √x1 或 ln x1。"}], "quiz": [{"q": "以下哪一個效用性質是本課實際使用的？", "options": ["基數性質，效用大小可比較倍數", "序數性質，只在意排序", "跨人比較的絕對效用", "效用差距的精確數值"], "answer": 1, "explain": "課文明確指出『我們只用效用的序數性質』。"}, {"q": "MRS(1,2) 以邊際效用表示為？", "options": ["MU1·MU2", "MU1 + MU2", "−MU1/MU2", "−MU2/MU1"], "answer": 2, "explain": "沿無異曲線 MU1·Δx1 + MU2·Δx2 = 0，推得 MRS(1,2) = −MU1/MU2。"}, {"q": "把 u 換成 v=f(u)（f 為遞增函數）後，MRS 會如何？", "options": ["會改變", "維持不變", "變成 0", "變為無窮大"], "answer": 1, "explain": "MU 會隨效用函數改變，但 MRS 不變，它是偏好本身的性質。"}, {"q": "下列何者屬於擬線性偏好的效用函數？", "options": ["u = x1·x2", "u = min(x1, x2)", "u = √x1 + x2", "u = 5x1 + 10x2"], "answer": 2, "explain": "擬線性偏好形如 v(x1)+x2，v 為凹函數，√x1 + x2 即符合。"}]}, {"num": 5, "title_en": "Choice", "title_zh": "選擇", "summary": "本章討論最適選擇（optimal choice）：消費者在預算集內選擇最好的組合。其充要條件是「嚴格優於 A 的組合集合不能與預算集相交」。相切（tangency）既非必要也非充分——在拗折偏好、角解時可能不相切但最適；在滿足點或凸性被違反時可能相切卻非最適。在內部最適時 MRS 等於相對價格比（MRS = p1/p2），並由此得到需求函數（demand function）。此 MRS 條件對帕累托效率有重要含意：若各人 MRS 不同便能交易並帕累托改善。", "key_terms": [{"term_en": "Optimal choice", "term_zh": "最適選擇", "def": "消費者在其預算集內能負擔的最好組合；由『預算集 + 偏好』共同決定。"}, {"term_en": "Necessary and sufficient condition", "term_zh": "充要條件", "def": "A 為最適的充要條件是：嚴格優於 A 的消費組合集合，不能與預算集相交。"}, {"term_en": "Tangency condition", "term_zh": "相切條件", "def": "相切既非必要也非充分：角解或拗折偏好可最適卻不相切（或相切未定義）；滿足點或凸性被違反時可相切卻非最適。"}, {"term_en": "Corner vs interior solution", "term_zh": "角解 vs 內部解", "def": "角解落在座標軸上（某財為零），相切可能不成立；內部解在內部，通常滿足 MRS = 相對價格比。"}, {"term_en": "MRS = price ratio", "term_zh": "MRS 等於相對價格比", "def": "MRS 是消費者願以財貨2支付、換一單位財貨1的比率；相對價格比是市場要求支付的比率；在（內部）最適時兩者相等。"}, {"term_en": "Demand function", "term_zh": "需求函數", "def": "在某價格與所得下的最適選擇即消費者的需求組合；需求函數把每財的最適數量表示為價格與所得的函數。"}], "key_points": ["最適選擇＝在預算集內選最好的組合；由預算集與偏好共同決定。", "充要條件：嚴格優於 A 的組合集合不能與預算集相交（否則存在可負擔且更佳的 B，A 就不是最適）。", "相切不是必要條件：角解或拗折偏好時可能最適卻不相切（或相切未定義）。", "相切不是充分條件：在滿足點（satiation）或凸性被違反時可能相切卻非最適。", "內部最適時 MRS = p1/p2：消費者願付比率等於市場要求比率。", "最適選擇隨價格與所得而變，即得到需求函數。", "MRS 條件的含意：均衡時各人 MRS 相等；若不同便能藉交易帕累托改善。"], "flashcards": [{"q": "最適選擇（optimal choice）由什麼決定？", "a": "由『預算集 + 偏好』共同決定，即在可負擔範圍內選最好的組合。"}, {"q": "A 為最適的充要條件是什麼？", "a": "嚴格優於 A 的組合集合，不能與預算集相交。"}, {"q": "相切是最適的必要條件嗎？舉一反例。", "a": "不是；角解或拗折偏好（相切未定義）時可最適卻不相切。"}, {"q": "相切是最適的充分條件嗎？舉一反例。", "a": "不是；在滿足點或凸性被違反時可能相切卻非最適。"}, {"q": "內部最適時 MRS 與價格的關係為何？其直覺？", "a": "MRS = p1/p2；消費者願付的比率等於市場要求的比率。"}, {"q": "各人 MRS 相等對帕累托效率有何含意？", "a": "均衡時各人 MRS 相等；若不同便可交易帕累托改善。"}], "quiz": [{"q": "消費者在 A 為最適的充要條件是？", "options": ["無異曲線與預算線相切", "嚴格優於 A 的組合集合不與預算集相交", "MRS 等於 0", "花光所有所得"], "answer": 1, "explain": "課文給的充要條件是：嚴格偏好 A 的組合集合不能與預算集相交。"}, {"q": "關於相切條件（tangency），下列何者正確？", "options": ["它是最適的必要且充分條件", "它既非必要也非充分", "它是必要但非充分", "它是充分但非必要"], "answer": 1, "explain": "角解／拗折可最適卻不相切；滿足或凸性違反時相切卻非最適，故既非必要也非充分。"}, {"q": "在內部最適（interior solution）時，最適條件為？", "options": ["MRS > p1/p2", "MRS < p1/p2", "MRS = p1/p2", "MRS = 0"], "answer": 2, "explain": "內部最適時消費者願付比率等於市場要求比率，即 MRS = p1/p2。"}, {"q": "若兩位消費者在均衡時 MRS 不相等，會發生什麼？", "options": ["已達帕累托效率", "他們可以交易並帕累托改善", "需求函數不存在", "違反預算限制"], "answer": 1, "explain": "MRS 不同代表換算比率不同，雙方可透過交易使彼此變好（帕累托改善）。"}]}, {"num": 6, "title_en": "Demand", "title_zh": "需求", "summary": "本章分析需求如何隨所得與價格改變。所得變動：需求隨所得增加而增加者為正常財（normal good），減少者為劣等財（inferior good），且可能因所得水準而異；連接最適組合可得所得提供曲線（IOC）與恩格爾曲線（Engel curve）。同比例的位似偏好（homothetic）維持財貨比例不變。價格變動：連接最適組合得價格提供曲線（POC）與需求曲線；自身價格上升使需求增加者為季芬財（Giffen good），否則為普通財。交叉價格關係決定替代品或互補品。反需求（inverse demand）可解讀為邊際願付（marginal willingness to pay），且 p1 = |MRS(1,2)|·p2。", "key_terms": [{"term_en": "Normal good / Inferior good", "term_zh": "正常財 / 劣等財", "def": "需求隨所得增加而增加者為正常財；隨所得增加而減少者為劣等財。同一財可能在不同所得水準下有不同性質。"}, {"term_en": "Income offer curve (IOC) / Engel curve", "term_zh": "所得提供曲線 / 恩格爾曲線", "def": "在 x1–x2 空間中隨預算線平移連接最適組合得所得提供曲線（IOC）；在 x1–m 空間中隨所得變化連接最適 x1 得恩格爾曲線。"}, {"term_en": "Homothetic preferences", "term_zh": "位似偏好", "def": "若 (x1,x2) 弱優於 (y1,y2)，則對所有 t>0，(t·x1,t·x2) 弱優於 (t·y1,t·y2)；此時只在意兩財比例，所得改變只依比例放大最適組合。"}, {"term_en": "Giffen good / Ordinary good", "term_zh": "季芬財 / 普通財", "def": "自身價格上升時需求反而增加者為季芬財；自身價格上升時需求減少（正常情形）者為普通財。"}, {"term_en": "Price offer curve (POC) / Demand curve", "term_zh": "價格提供曲線 / 需求曲線", "def": "在 x1–x2 空間中隨自身價格改變、預算線旋轉連接最適組合得價格提供曲線（POC）；在 x1–p1 空間中連接最適 x1 得需求曲線。"}, {"term_en": "Substitute / Complement", "term_zh": "替代品 / 互補品", "def": "當另一財價格 p2 上升使財貨1需求增加，則財貨1是財貨2的替代品；若 p2 上升使財貨1需求減少，則為互補品。"}, {"term_en": "Inverse demand & marginal willingness to pay", "term_zh": "反需求與邊際願付", "def": "反需求可解讀為邊際願付：p1 = |MRS(1,2)|·p2，即消費者為多得一點財貨1願放棄多少（以金錢衡量）。"}], "key_points": ["所得效果：正常財需求隨所得增加而增加，劣等財則減少，且可能因所得水準而異。", "所得提供曲線（IOC）在 x1–x2 空間連接隨所得平移的最適組合；恩格爾曲線在 x1–m 空間連接最適 x1。", "位似偏好只在意兩財比例：找到最適比例後，所得改變時比例維持不變（依比例放大）。", "自身價格效果：連接最適組合得價格提供曲線（POC）；在 x1–p1 空間得需求曲線。", "季芬財為自身價格上升時需求反而增加者，否則為普通財。", "交叉價格：p2 上升使財貨1需求增加為替代品，需求減少為互補品。", "反需求即邊際願付：p1 = |MRS(1,2)|·p2，衡量消費者為多得一點財貨1願放棄的金錢。"], "flashcards": [{"q": "正常財與劣等財如何以所得效果區分？", "a": "需求隨所得增加而增加為正常財；隨所得增加而減少為劣等財；同一財可能因所得水準而異。"}, {"q": "所得提供曲線（IOC）與恩格爾曲線（Engel）各在什麼空間畫？", "a": "IOC 在 x1–x2 空間連接隨預算線平移的最適組合；Engel 在 x1–m 空間連接隨所得變化的最適 x1。"}, {"q": "位似偏好（homothetic）的關鍵性質是什麼？", "a": "只在意兩財比例；若某比例在所得 m 為最適，則所得變為 tm 時 (t·x1,t·x2) 仍最適，比例不變。"}, {"q": "季芬財（Giffen good）的定義是什麼？", "a": "自身價格上升時需求反而增加的財貨；反之為普通財。"}, {"q": "如何判斷財貨1是財貨2的替代品或互補品？", "a": "另一財價格 p2 上升使財貨1需求增加為替代品，使需求減少為互補品。"}, {"q": "反需求（inverse demand）如何解讀？公式為何？", "a": "解讀為邊際願付：p1 = |MRS(1,2)|·p2，衡量為多得一點財貨1願放棄的金錢。"}], "quiz": [{"q": "某財貨需求隨所得增加而『減少』，它屬於？", "options": ["正常財", "劣等財", "季芬財", "替代品"], "answer": 1, "explain": "需求隨所得增加而減少者為劣等財（inferior good）。"}, {"q": "在 x1–m 空間中，連接隨所得變化的最適 x1 所得到的曲線稱為？", "options": ["所得提供曲線（IOC）", "價格提供曲線（POC）", "恩格爾曲線（Engel curve）", "需求曲線"], "answer": 2, "explain": "x1–m 空間連接最適 x1 得恩格爾曲線；x1–x2 空間才是 IOC。"}, {"q": "自身價格上升時需求反而增加的財貨稱為？", "options": ["正常財", "普通財", "季芬財（Giffen good）", "替代品"], "answer": 2, "explain": "自身價格上升使需求增加者為季芬財；一般情形（需求減少）為普通財。"}, {"q": "若另一財價格 p2 上升，導致財貨1的需求增加，則財貨1是財貨2的？", "options": ["互補品", "替代品", "劣等財", "季芬財"], "answer": 1, "explain": "p2 上升使財貨1需求增加，代表兩者為替代關係（substitute）。"}, {"q": "反需求可寫成 p1 = |MRS(1,2)|·p2，它代表消費者的？", "options": ["市場均衡價格", "邊際願付（marginal willingness to pay）", "所得水準", "生產成本"], "answer": 1, "explain": "反需求解讀為邊際願付，衡量為多得一點財貨1願放棄多少金錢。"}]}, {"num": 7, "title_en": "Revealed Preference", "title_zh": "顯示性偏好", "summary": "本章從消費者的實際選擇行為出發，反向推論其偏好。維持三項假設：偏好在觀察期間穩定、每個預算集有唯一的需求束、消費者永遠選擇他能負擔得起的最佳束。若在價格與所得(p1,p2,m)下選了(x1,x2)，且另一束(y1,y2)也負擔得起（花費不超過所得），則稱(x1,x2)『直接顯示性偏好』於(y1,y2)。透過選擇鏈可再推得『間接顯示性偏好』。這些關係只描述選擇本身，但選擇與偏好相連。弱顯示性偏好公理(WARP)是消費者極大化行為的一個弱而合乎邏輯的推論。", "key_terms": [{"term_en": "Directly Revealed Preferred", "term_zh": "直接顯示性偏好", "def": "若在某價格所得下選了(x1,x2)，而(y1,y2)也負擔得起，則(x1,x2)直接顯示性偏好於(y1,y2)，記作(x1,x2) d (y1,y2)。"}, {"term_en": "Indirectly Revealed Preferred", "term_zh": "間接顯示性偏好", "def": "若(x1,x2)直接顯示性偏好於(y1,y2)，且(y1,y2)直接顯示性偏好於(z1,z2)，則(x1,x2)間接顯示性偏好於(z1,z2)，可延伸至長度超過3的選擇鏈。"}, {"term_en": "Weak Axiom of Revealed Preference (WARP)", "term_zh": "弱顯示性偏好公理", "def": "消費者極大化行為的弱而合乎邏輯的推論：若某束被直接顯示性偏好於另一束，則另一束不應反過來被顯示性偏好於它。"}, {"term_en": "Maintained Assumptions", "term_zh": "維持假設", "def": "三項基本假設：偏好在觀察期間穩定、每個預算集有唯一需求束、消費者永遠選擇能負擔的最佳束（行為模型）。"}, {"term_en": "Demanded Bundle", "term_zh": "需求束", "def": "在給定預算集下消費者所選擇的商品組合，假設對每個預算集為唯一。"}], "key_points": ["顯示性偏好從實際選擇行為反推偏好，而非先假設偏好再推選擇。", "『直接顯示性偏好』的條件是：被比較的束在原選擇的價格所得下也負擔得起。", "透過選擇鏈可將直接關係延伸為間接顯示性偏好，鏈長可超過3。", "顯示性偏好(d)只關於選擇本身，但選擇與偏好互相關聯。", "WARP是消費者極大化行為的弱且合乎邏輯的推論。", "三項維持假設中，唯一需求束的假設較容易放鬆。"], "flashcards": [{"q": "何謂『直接顯示性偏好』？", "a": "若在價格所得(p1,p2,m)下選了(x1,x2)，而另一束(y1,y2)的花費也在所得內（負擔得起），則(x1,x2)直接顯示性偏好於(y1,y2)。"}, {"q": "直接與間接顯示性偏好如何連結？", "a": "若(x1,x2) d (y1,y2)且(y1,y2) d (z1,z2)，則(x1,x2)間接顯示性偏好於(z1,z2)；可推廣到更長的選擇鏈。"}, {"q": "WARP是什麼的推論？", "a": "它是消費者極大化行為的一個弱而合乎邏輯的推論。"}, {"q": "本章的三項維持假設為何？", "a": "偏好在觀察期間穩定、每個預算集有唯一需求束、消費者永遠選擇能負擔得起的最佳束。"}, {"q": "顯示性偏好關係(d)描述的是偏好還是選擇？", "a": "它只描述選擇本身，但選擇與偏好是相關聯的。"}], "quiz": [{"q": "要說(x1,x2)『直接顯示性偏好』於(y1,y2)，必須滿足什麼條件？", "options": ["(x1,x2)比(y1,y2)貴", "在選(x1,x2)的價格所得下，(y1,y2)也負擔得起", "兩束效用相等", "(y1,y2)不在預算線上"], "answer": 1, "explain": "直接顯示性偏好的條件是被比較束在原價格所得下也能負擔，卻仍選了(x1,x2)。"}, {"q": "下列何者最能描述顯示性偏好理論的方法？", "options": ["先假設效用函數再推選擇", "從實際選擇行為反推偏好", "只用無異曲線分析", "假設消費者非理性"], "answer": 1, "explain": "顯示性偏好從觀察到的選擇行為出發，反向推論消費者的偏好。"}, {"q": "WARP是下列哪種行為的邏輯推論？", "options": ["生產者利潤極大化", "消費者極大化行為", "政府稅收極大化", "廠商成本極小化"], "answer": 1, "explain": "課文指出WARP是消費者極大化行為的弱而合乎邏輯的推論。"}, {"q": "關於間接顯示性偏好，下列敘述何者正確？", "options": ["只能用於恰好3個選擇", "透過選擇鏈可延伸，鏈長可超過3", "與直接顯示性偏好無關", "需要知道確切效用值"], "answer": 1, "explain": "間接顯示性偏好允許長度超過3的觀察選擇鏈。"}]}, {"num": 8, "title_en": "Slutsky Equation", "title_zh": "史勒茨基方程式", "summary": "本章將價格變動造成的總效果(TE)分解為替代效果(SE)與所得效果(IE)。史勒茨基的作法是：價格改變後，透過『樞轉(pivot)』調整所得，使原最適束『剛好』仍負擔得起，以控制購買力，此時的需求變動即替代效果；再『移動(shift)』把所得還原到實際新水準，造成的變動即所得效果。史勒茨基恆等式為TE=SE+IE。替代效果恆為弱負向（與價格變動反向）。對正常財，所得效果與替代效果同向，故需求曲線向下傾斜。特例：完全互補品替代效果為零、完全替代品所得效果為零、準線性偏好在某點之後所得效果為零。希克斯替代效果則以維持效用不變（買到與原束無異的束）來定義，同樣為負。", "key_terms": [{"term_en": "Total Effect (TE)", "term_zh": "總效果", "def": "價格變動所引起需求量的全部改變，等於替代效果加所得效果。"}, {"term_en": "Substitution Effect (SE)", "term_zh": "替代效果", "def": "調整所得使原最適束剛好仍負擔得起後，因相對價格改變而產生的需求變動；恆為弱負向，與價格變動反向。"}, {"term_en": "Income Effect (IE)", "term_zh": "所得效果", "def": "將所得由樞轉後水準還原到實際新水準所引起的需求變動；正常財時使該財消費隨購買力增加而增加。"}, {"term_en": "Slutsky Identity", "term_zh": "史勒茨基恆等式", "def": "價格變動的總效果等於替代效果與所得效果之和，即TE=SE+IE。"}, {"term_en": "Pivot and Shift", "term_zh": "樞轉與移動", "def": "史勒茨基分解的兩步驟：樞轉調整所得使原最適束剛好可負擔（得替代效果），再平移還原所得（得所得效果）。"}, {"term_en": "Hicks Substitution Effect", "term_zh": "希克斯替代效果", "def": "以維持效用不變為基準：原束或許不再可負擔，但可買到與原束無異的束；此替代效果亦為負。"}], "key_points": ["史勒茨基將價格變動的總效果分解為替代效果與所得效果：TE=SE+IE。", "樞轉時，調整所得使原最適束『剛好』仍負擔得起，以控制購買力。", "替代效果恆為弱負向，即需求變動方向與價格變動相反。", "對正常財，替代效果與所得效果同向，故需求曲線向下傾斜。", "特例：完全互補品替代效果為零；完全替代品所得效果為零；準線性偏好某點後所得效果為零。", "希克斯替代效果以效用不變（無異於原束）定義，同樣為負；其所得效果視商品為正常或劣等而定。", "退稅例子（忽略稅賦歸宿）：定額退稅使消費者變差，減少該財消費，屬純替代效果。"], "flashcards": [{"q": "史勒茨基恆等式的內容為何？", "a": "價格變動的總效果等於替代效果加所得效果，TE=SE+IE。"}, {"q": "史勒茨基的『樞轉』步驟目的為何？", "a": "調整所得使原最適束剛好仍負擔得起，以控制（維持）購買力，藉此分離出替代效果。"}, {"q": "替代效果的符號如何判定？", "a": "替代效果恆為弱負向，需求變動方向與價格變動相反。"}, {"q": "為何正常財的需求曲線向下傾斜？", "a": "因為對正常財，替代效果與所得效果同向（皆使降價時消費增加），故需求向下傾斜。"}, {"q": "希克斯替代效果與史勒茨基替代效果的定義差異？", "a": "希克斯以維持效用不變（買到與原束無異的束）為基準，史勒茨基則以維持原束剛好可負擔（購買力）為基準。"}], "quiz": [{"q": "史勒茨基分解中『樞轉』調整所得的目的是？", "options": ["使消費者效用最大", "使原最適束剛好仍可負擔以控制購買力", "使新束不可負擔", "使所得歸零"], "answer": 1, "explain": "樞轉調整所得，讓原最適束剛好可負擔，藉此控制購買力以分離替代效果。"}, {"q": "關於替代效果的符號，下列何者正確？", "options": ["恆為正", "恆為弱負向，與價格變動反向", "視商品正常或劣等而定", "恆為零"], "answer": 1, "explain": "替代效果恆為弱負向，移動方向與價格變動相反。"}, {"q": "下列哪一組特例配對正確？", "options": ["完全互補品→所得效果為零", "完全替代品→所得效果為零", "準線性偏好→替代效果恆為零", "正常財→替代效果為正"], "answer": 1, "explain": "課文指出完全替代品的所得效果為零；完全互補品是替代效果為零。"}, {"q": "對正常財，替代效果與所得效果的關係使需求曲線？", "options": ["向上傾斜", "水平", "向下傾斜", "垂直"], "answer": 2, "explain": "正常財的替代與所得效果同向，兩者皆使降價時消費增加，故需求向下傾斜。"}, {"q": "希克斯替代效果的定義基準為何？", "options": ["維持原束剛好可負擔", "維持效用不變（無異於原束）", "維持名目所得不變", "維持價格不變"], "answer": 1, "explain": "希克斯替代效果以維持效用不變、可買到與原束無異的束為基準。"}]}, {"num": 9, "title_en": "Buying and Selling", "title_zh": "買進與賣出", "summary": "本章引入稟賦(endowment)：人們透過賣出自己擁有的東西賺取所得，因此除了一般所得效果外，還有額外的『稟賦所得效果』。稟賦的價值等於價格乘以稟賦(p1w1+p2w2)。當某財價格上升時，若消費者是該財的淨供給者，稟賦價值上升會使其變得更好。史勒茨基方程式因而擴充為三項：替代效果、一般所得效果(OIE)與稟賦所得效果(EIE)。應用於勞動供給：工資上升時，替代效果使閒暇減少（勞動增加），但若閒暇為正常財，所得效果使閒暇增加（勞動減少），總效果可能使勞動減少，形成『後彎的勞動供給曲線』。若要純粹增加勞動供給，需製造純替代效果，例如加班費（高於原工資）。", "key_terms": [{"term_en": "Endowment", "term_zh": "稟賦", "def": "消費者原本擁有的商品組合(w1,w2)，可賣出換取所得，也可留下自用。"}, {"term_en": "Endowment Income Effect (EIE)", "term_zh": "稟賦所得效果", "def": "價格變動改變稟賦價值(pw)，進而改變購買力所造成的額外需求變動，是買賣模型中新增的項目。"}, {"term_en": "Ordinary Income Effect (OIE)", "term_zh": "一般所得效果", "def": "在史勒茨基分解中，將所得還原到維持稟賦價值後水準所造成的需求變動。"}, {"term_en": "Net Supplier / Net Demander", "term_zh": "淨供給者／淨需求者", "def": "淨供給者賣出多於買入該財；某財漲價時，淨供給者因稟賦價值上升而變好。"}, {"term_en": "Backward-Bending Labor Supply", "term_zh": "後彎的勞動供給曲線", "def": "工資上升時，若閒暇為正常財，所得效果可能大到使勞動供給反而減少，使供給曲線後彎。"}, {"term_en": "Overtime Wage", "term_zh": "加班工資", "def": "高於原工資的加班費，可製造純替代效果以增加勞動供給。"}], "key_points": ["人們靠賣出所擁有之物賺取所得，因此有額外的稟賦所得效果。", "稟賦價值為p1w1+p2w2（記作pw）；價格變動會改變此價值。", "當某財漲價，若消費者是該財淨供給者，稟賦價值上升使其變得更好。", "買賣模型的史勒茨基方程式擴充為三項：替代效果(SE)、一般所得效果(OIE)、稟賦所得效果(EIE)。", "勞動供給中，工資上升的替代效果增加勞動，但閒暇為正常財時所得效果減少勞動。", "若所得效果夠大，工資上升反而減少勞動，形成後彎的勞動供給曲線。", "加班費（高於原工資）製造純替代效果，可用來增加勞動供給。"], "flashcards": [{"q": "買賣模型比純消費模型多了哪個效果？", "a": "稟賦所得效果(EIE)：因價格變動改變稟賦價值(pw)而產生的額外需求變動。"}, {"q": "稟賦價值如何計算？", "a": "以價格乘稟賦：p1w1+p2w2，簡記為pw。"}, {"q": "某財漲價時，什麼樣的消費者會變得更好？", "a": "該財的淨供給者，因為稟賦價值上升，購買力增加。"}, {"q": "後彎的勞動供給曲線如何形成？", "a": "工資上升時替代效果增加勞動，但閒暇為正常財時所得效果減少勞動；若所得效果夠大，勞動反而下降。"}, {"q": "若想純粹增加勞動供給，該用什麼辦法？", "a": "製造純替代效果，例如提供高於原工資的加班費。"}], "quiz": [{"q": "買賣（有稟賦）模型的史勒茨基方程式包含哪三項？", "options": ["替代效果、名目效果、實質效果", "替代效果、一般所得效果、稟賦所得效果", "替代效果、稅賦效果、補貼效果", "所得效果、財富效果、通膨效果"], "answer": 1, "explain": "含稟賦時分解為SE、OIE與EIE三項。"}, {"q": "當某財價格上升，下列何者會因此變得更好？", "options": ["該財的淨需求者", "該財的淨供給者", "不消費該財者", "所有消費者"], "answer": 1, "explain": "淨供給者的稟賦價值隨該財漲價而上升，購買力增加。"}, {"q": "後彎勞動供給曲線出現的關鍵原因是？", "options": ["閒暇為劣等財", "替代效果為零", "閒暇為正常財且所得效果夠大", "工資固定不變"], "answer": 2, "explain": "閒暇為正常財時，工資上升的所得效果增加閒暇（減少勞動），若夠大則勞動反減。"}, {"q": "要製造純替代效果以增加勞動供給，最適合的方式是？", "options": ["降低基本工資", "提供高於原工資的加班費", "課徵所得稅", "發放定額補貼"], "answer": 1, "explain": "加班費高於原工資，屬純替代效果，可增加勞動供給。"}]}, {"num": 10, "title_en": "Intertemporal Choice", "title_zh": "跨期選擇", "summary": "本章分析消費者在不同時期之間的消費配置。以今日消費c1與明日消費c2為例，若放棄今日一單位消費而儲蓄，可在明日換得(1+r)倍的購買力，其中r為利率。預算線可寫成以現值或未來值表示，並可導入實質利率（把物價變動考量進去）。跨期的史勒茨基方程式顯示：利率上升時，借款者（今日消費超過今日所得者）在假設消費為正常財下會減少今日消費；放款者的總效果則不明確。債券定價原則：價格必須等於未來給付的現值（淨現值為零），否則無人買或人人買。實務上利率眾多，關鍵原則是利率衡量資金的機會成本，應採用反映次佳替代用途的利率。核心目標是把預算集擴到最大。", "key_terms": [{"term_en": "Intertemporal Choice", "term_zh": "跨期選擇", "def": "消費者在不同時期（如今日與明日）之間如何配置消費的決策。"}, {"term_en": "Real Interest Rate", "term_zh": "實質利率", "def": "把物價變動納入考量後的利率；若名目利率為r、物價變動比為π，則(1+實質利率)=(1+r)/(1+π)。"}, {"term_en": "Present Value", "term_zh": "現值", "def": "未來各期給付以利率折現後在今日的價值，例如x/(1+r)+x/(1+r)平方+…+F/(1+r)的T次方。"}, {"term_en": "Borrower / Lender", "term_zh": "借款者／放款者", "def": "借款者今日消費超過今日所得；放款者反之。利率上升對借款者（正常財假設下）減少今日消費，對放款者總效果不明確。"}, {"term_en": "Opportunity Cost of Funds", "term_zh": "資金的機會成本", "def": "利率衡量資金的機會成本；應採用反映你次佳替代用途的利率。"}, {"term_en": "Bond Pricing (Zero NPV)", "term_zh": "債券定價（淨現值為零）", "def": "債券價格須等於未來給付的現值；價格高於現值則無人買，低於現值則人人買，故均衡時淨現值為零。"}], "key_points": ["放棄今日一單位消費而儲蓄，明日可換得(1+r)倍購買力，r為利率。", "預算線可用現值或未來值表示，並可導入實質利率把物價變動納入考量。", "利率上升時，借款者在正常財假設下會減少今日消費；放款者的總效果不明確。", "債券的合理價格等於其未來給付的現值，均衡時淨現值為零。", "價格高於現值則無人買，低於現值則人人買。", "利率衡量資金的機會成本，應採用反映次佳替代用途的利率。", "始終記住目標是把預算集擴到最大。"], "flashcards": [{"q": "放棄今日一單位消費去儲蓄，明日能換到多少？", "a": "(1+r)倍的購買力，r為利率（更精確為p1(1+r)/p2）。"}, {"q": "實質利率如何定義？", "a": "把物價變動考量進去：(1+實質利率)=(1+r)/(1+物價變動比)。"}, {"q": "利率上升對借款者今日消費的影響？", "a": "在假設消費為正常財下，借款者會減少今日消費；放款者的總效果則不明確。"}, {"q": "債券的合理價格應等於什麼？", "a": "等於未來給付的現值；均衡時淨現值為零。"}, {"q": "面對眾多利率時應採用哪一個？", "a": "反映你次佳替代用途（second best alternative）的利率，因為利率衡量資金的機會成本。"}], "quiz": [{"q": "放棄今日一單位消費儲蓄，明日大約可換得多少購買力？", "options": ["(1-r)倍", "(1+r)倍", "r倍", "不變"], "answer": 1, "explain": "儲蓄一單位可在明日換得(1+r)倍購買力。"}, {"q": "利率上升時，下列敘述何者正確？", "options": ["借款者（正常財）減少今日消費", "放款者一定減少今日消費", "借款者一定增加今日消費", "所有人今日消費不變"], "answer": 0, "explain": "課文指出借款者在正常財假設下今日消費減少；放款者總效果不明確。"}, {"q": "債券的均衡價格滿足什麼條件？", "options": ["高於現值", "低於現值", "等於未來給付的現值（淨現值為零）", "等於面額"], "answer": 2, "explain": "價格高於現值無人買、低於現值人人買，故均衡時等於現值、淨現值為零。"}, {"q": "選擇折現用的利率時，關鍵原則是？", "options": ["用最低的利率", "用最高的利率", "用反映次佳替代用途的利率（機會成本）", "用固定的官方利率"], "answer": 2, "explain": "利率衡量資金機會成本，應採用反映你次佳替代用途的利率。"}]}, {"num": 11, "title_en": "Asset Markets", "title_zh": "資產市場", "summary": "本章以資產報酬的角度分析投資與消費時機。以砍樹為例：森林如同銀行裡的錢一樣成長，只要森林成長率高於(1+r)就繼續等待，當成長率降到低於(1+r)時就應在該時點T砍伐——因為在任何時點，你都應把資金放在報酬最高的『銀行』（金融銀行或『樹』銀行）。機會成本概念說明：若六週後每加侖能賣1.5，就不該現在以遠低於1.5的價格賣出；同時合理的反應是今天少消費並嘗試發明替代品。資產市場如同股市：市場在得知未來事件資訊的當下就反應，不會等到未來事件真正實現才反應。", "key_terms": [{"term_en": "Asset Markets", "term_zh": "資產市場", "def": "分析各種資產報酬與資金配置時機的市場；理性下各資產在均衡應提供相同的報酬率。"}, {"term_en": "Optimal Harvesting Time", "term_zh": "最適砍伐時點", "def": "當森林成長率高於(1+r)就繼續等，降到低於(1+r)時就在該時點T砍伐，使資金總放在報酬最高處。"}, {"term_en": "Opportunity Cost", "term_zh": "機會成本", "def": "若未來能以較高價格賣出，就不該現在以遠低的價格賣；合理反應是今天少消費並嘗試發明替代品。"}, {"term_en": "Market Reaction to Information", "term_zh": "市場對資訊的反應", "def": "如同股市，市場在得知未來事件資訊的當下即反應，不會等到事件真正實現才反應。"}, {"term_en": "Rate of Return / (1+r)", "term_zh": "報酬率／(1+r)", "def": "以(1+r)為基準比較各資產成長：成長率高於(1+r)值得持有，低於則應變現另作他用。"}], "key_points": ["森林成長如同銀行裡的錢成長，資金應總放在報酬最高的『銀行』。", "當森林成長率高於(1+r)就繼續等，降到低於(1+r)時就在時點T砍伐。", "機會成本：若六週後每加侖能賣1.5，就不該現在以遠低於1.5的價格賣出。", "面對稀缺，合理反應是今天少消費並嘗試發明替代品。", "資產市場如同股市，市場在資訊已知的當下反應，不等事件實現才反應。"], "flashcards": [{"q": "砍樹的最適時點T如何判定？", "a": "當森林成長率高於(1+r)就繼續等，降到低於(1+r)時就在該時點砍伐。"}, {"q": "為何要在成長率降到(1+r)以下時砍樹？", "a": "因為在任何時點都應把資金放在報酬最高的『銀行』，成長率低於利率時金融銀行報酬較高。"}, {"q": "機會成本如何解釋不現在賤賣的道理？", "a": "若六週後每加侖能賣1.5，現在以遠低於1.5賣出就是愚蠢，因為放棄了更高的未來價值。"}, {"q": "資產市場對未來事件的反應時機為何？", "a": "如同股市，市場在得知資訊的當下就反應，不會等到未來事件真正實現。"}], "quiz": [{"q": "根據砍樹法則，應在何時砍伐？", "options": ["森林成長率永遠高於(1+r)時", "森林成長率由高於(1+r)降到低於(1+r)的時點T", "森林剛種下時", "利率為零時"], "answer": 1, "explain": "當成長率跨過(1+r)由高轉低的時點T砍伐，使資金總放在報酬最高處。"}, {"q": "把森林比作銀行的核心含意是？", "options": ["森林不會成長", "資金應總放在報酬最高的地方", "利率無關緊要", "只能存金融銀行"], "answer": 1, "explain": "森林如同會成長的存款，任何時點都應把資金放在報酬最高的『銀行』。"}, {"q": "資產市場（如股市）何時對未來事件反應？", "options": ["事件真正實現時", "得知未來事件資訊的當下", "事件過後一年", "永不反應"], "answer": 1, "explain": "市場在資訊已知的當下即反應，不等事件實現。"}, {"q": "面對某資源未來會更值錢，合理的當下反應是？", "options": ["現在盡量多消費", "今天少消費並嘗試發明替代品", "立刻低價賣光", "忽略價格訊號"], "answer": 1, "explain": "課文建議今天少消費並嘗試發明替代品，反映機會成本。"}]}, {"num": 12, "title_en": "Uncertainty", "title_zh": "不確定性", "summary": "本章以『相機消費計畫(contingent consumption plan)』處理不確定性：世界有若干自然狀態(s1,…,sn)各帶機率，在狀態i下消費為ci，計畫(c1,…,cn)指明各狀態下要消費什麼。偏好可能取決於各狀態的機率。若偏好可寫成u=機率1乘v(c1)+機率2乘v(c2)+…的形式，即為『期望效用函數』，其中v(c)是確定消費的效用。期望效用具有獨立性性質：某狀態發生時其他狀態不會發生，故共同的無關結果不影響偏好。期望效用函數經正的仿射轉換(f(u)=au+b)後仍為期望效用函數。艾雷悖論(Allais paradox)顯示人們的實際選擇有時違反期望效用。保險方面：公平保險指保險公司平均損益兩平，保費率等於損失機率(r=1-p)。面對公平保險，風險趨避的期望效用極大化者會選擇完全投保（使各狀態消費相等c1=c2）；若保險公司有利潤(r>1-p)，則不會完全投保，損失狀態下的財富較低。", "key_terms": [{"term_en": "Contingent Consumption Plan", "term_zh": "相機消費計畫", "def": "指明在不同自然狀態下各將消費什麼的計畫(c1,…,cn)，ci為狀態i下的消費。"}, {"term_en": "Expected Utility", "term_zh": "期望效用", "def": "效用可寫成各狀態機率對v(c)的加權和，如機率1乘v(c1)加機率2乘v(c2)；v(c)為確定消費的效用。"}, {"term_en": "Risk Aversion", "term_zh": "風險趨避", "def": "偏好確定結果甚於具相同期望值的風險；因v()為凹函數，無異曲線凸向原點。"}, {"term_en": "Fair Insurance", "term_zh": "公平保險", "def": "保險公司平均損益兩平，保費率等於損失發生機率，即r=1-p。"}, {"term_en": "Full Insurance", "term_zh": "完全投保", "def": "面對公平保險，風險趨避的期望效用極大化者會使各狀態消費相等(c1=c2)，即完全投保。"}, {"term_en": "Allais Paradox", "term_zh": "艾雷悖論", "def": "人們在L1、L2與L3、L4等彩局間的實際選擇有時互相矛盾，違反期望效用理論。"}], "key_points": ["相機消費計畫(c1,…,cn)指明各自然狀態下的消費；偏好可能取決於狀態機率。", "若效用可寫成各狀態機率對v(c)的加權和，即為期望效用函數，v(c)是確定消費的效用。", "期望效用具獨立性：某狀態發生則他狀態不發生，共同無關結果不影響偏好。", "期望效用函數經正的仿射轉換f(u)=au+b後仍為期望效用函數。", "公平保險指保險公司平均損益兩平，保費率等於損失機率(r=1-p)。", "面對公平保險，風險趨避的期望效用極大化者會完全投保，使各狀態消費相等(c1=c2)。", "若保險公司有利潤(r>1-p)，則不完全投保，損失狀態下財富較低；艾雷悖論顯示實際選擇可能違反期望效用。"], "flashcards": [{"q": "何謂相機消費計畫？", "a": "一組(c1,…,cn)，指明在不同自然狀態下各將消費什麼，ci為狀態i下的消費。"}, {"q": "期望效用函數的形式為何？", "a": "各狀態機率對v(c)的加權和，例如機率1乘v(c1)加機率2乘v(c2)；v(c)代表確定消費的效用。"}, {"q": "公平保險的保費率如何決定？", "a": "使保險公司平均損益兩平，保費率等於損失發生的機率，即r=1-p。"}, {"q": "面對公平保險，風險趨避者會如何選擇？", "a": "會選擇完全投保，使各狀態下消費相等(c1=c2)。"}, {"q": "期望效用函數經正的仿射轉換後還是期望效用函數嗎？", "a": "是。若f(u)=au+b且a為正，轉換後仍為期望效用函數。"}, {"q": "艾雷悖論說明什麼？", "a": "人們在特定彩局間的實際選擇互相矛盾，違反期望效用理論的預測。"}], "quiz": [{"q": "『相機消費計畫』指的是？", "options": ["確定不變的單一消費束", "指明各自然狀態下要消費什麼的計畫", "只在無風險時的消費", "保險公司的定價表"], "answer": 1, "explain": "相機消費計畫(c1,…,cn)是對不同自然狀態下消費的完整指定。"}, {"q": "下列何者為期望效用函數的形式？", "options": ["機率1乘v(c1)加機率2乘v(c2)", "c1乘c2", "c1減c2", "固定常數"], "answer": 0, "explain": "期望效用是各狀態機率對v(c)的加權和，v(c)為確定消費的效用。"}, {"q": "公平保險的定義是？", "options": ["保費率高於損失機率", "保險公司平均損益兩平，r=1-p", "保費為零", "全額補償且免費"], "answer": 1, "explain": "公平保險使保險公司平均損益兩平，保費率等於損失機率(r=1-p)。"}, {"q": "面對公平保險，風險趨避的期望效用極大化者最適選擇為？", "options": ["完全不投保", "完全投保，使c1=c2", "只投保一半", "隨機選擇"], "answer": 1, "explain": "公平保險下最適條件使兩狀態消費相等，即完全投保。"}, {"q": "若保險公司有利潤(r>1-p)，消費者的最適選擇為？", "options": ["仍完全投保", "不完全投保，損失狀態下財富較低", "完全不投保", "投保超過損失額"], "answer": 1, "explain": "有利潤時r>1-p，最適不再是c1=c2，損失狀態下財富較低，屬不完全投保。"}]}, {"num": 14, "title_en": "Consumer's Surplus", "title_zh": "消費者剩餘", "summary": "本章說明如何從需求推估效用。對於準線性偏好（quasilinear preferences），需求曲線下的面積代表消費者若能免費取得財貨時的效用變化。消費者剩餘（consumer's surplus）是介於需求曲線與價格之間的面積，代表由「不消費」到「消費」的效用變化。可從保留價格（每單位願付價格 r 減去價格 p）加總得到，也可用需求曲線下面積表示。當偏好非準線性時，消費者剩餘仍常是消費者福利的合理近似；若近似不夠好，則可改用補償變量（compensating variation）與等值變量（equivalent variation）兩種以貨幣衡量效用變化的方法。本章並延伸到生產者剩餘與消費者剩餘的加總。", "key_terms": [{"term_en": "Consumer's Surplus (CS)", "term_zh": "消費者剩餘", "def": "介於需求曲線與價格之間的面積，代表由不消費到消費的效用變化；等於各單位保留價格與價格之差的加總，即 (r1-p)+(r2-p)+...。"}, {"term_en": "Quasilinear Preferences", "term_zh": "準線性偏好", "def": "效用函數形如 v(x)+m 的偏好；在此情形下需求曲線下面積可精確衡量效用變化，使消費者剩餘的計算相當簡潔（tidy）。"}, {"term_en": "Reservation Price", "term_zh": "保留價格", "def": "消費者對某一單位財貨願意支付的最高價格 r；第一單位為 r1、第二單位 r2 依此類推，反需求曲線即由這些保留價格構成。"}, {"term_en": "Compensating Variation (C)", "term_zh": "補償變量", "def": "價格改變後，為使消費者回到原效用水準所需給予或取走的貨幣金額；為衡量效用變化的貨幣測度之一。"}, {"term_en": "Equivalent Variation (E)", "term_zh": "等值變量", "def": "在原價格下，能使消費者達到新效用水準所等值的貨幣金額；為衡量效用變化的另一貨幣測度。"}, {"term_en": "Producer's Surplus (PS)", "term_zh": "生產者剩餘", "def": "介於價格與供給曲線之間的面積，衡量出售（相對於不出售）所得的剩餘；以出售稟賦（endowment）方式思考，第一單位的剩餘為 p-r1。"}], "key_points": ["對準線性偏好，需求曲線下面積等於消費者若免費取得財貨時的效用變化。", "消費者買 3 單位的效用變化為 v(3)-v(0)-3p，即需求曲線與價格間、至第 3 單位的面積，稱為消費者剩餘。", "消費者剩餘亦可視為各單位保留價格與價格之差的加總：(r1-p)+(r2-p)+(r3-p)。", "因 MRS 等於反需求（價格），畫反需求曲線等同於畫邊際效用 v'(x)。", "價格由 p' 變為 p'' 時的消費者剩餘變化由一塊長方形面積加上一塊近似三角形面積組成。", "偏好非準線性時消費者剩餘仍常為合理的福利近似；若不足夠精確，可改用補償變量與等值變量兩種貨幣測度。", "生產者剩餘可用「出售稟賦」的角度處理，為價格與供給曲線間的面積；並可將個別消費者剩餘加總為市場的消費者剩餘。"], "flashcards": [{"q": "消費者剩餘（consumer's surplus）在圖形上是哪個面積？", "a": "介於需求曲線與價格之間的面積，代表由不消費到消費的效用變化。"}, {"q": "在準線性偏好下，消費 3 單位的效用變化如何表示？", "a": "v(3)-v(0)-3p，即需求曲線與價格間至第 3 單位的面積。"}, {"q": "為什麼畫反需求曲線就等於畫邊際效用 v'(x)？", "a": "因為 MRSxy = v'(x)/1 = p/1，價格（反需求）等於邊際效用。"}, {"q": "當偏好非準線性、消費者剩餘近似不夠好時，教材介紹哪兩種貨幣測度？", "a": "補償變量（compensating variation, C）與等值變量（equivalent variation, E）。"}, {"q": "生產者剩餘（producer's surplus）以出售稟賦角度看，第一單位的剩餘是多少？", "a": "p - r1，其中 r1 = v(n)-v(n-1) 為出售第一單位的保留價格。"}], "quiz": [{"q": "在準線性偏好下，需求曲線下的面積代表什麼？", "options": ["消費者若能免費取得財貨時的效用變化", "廠商的總收益", "政府的稅收", "生產成本"], "answer": "消費者若能免費取得財貨時的效用變化", "explain": "本章核心概念：對準線性偏好，需求曲線下面積即消費者免費取得財貨時的效用變化。"}, {"q": "消費者剩餘等於下列何者？", "options": ["各單位保留價格與價格之差的加總", "價格乘以數量", "需求曲線的斜率", "所得減去支出"], "answer": "各單位保留價格與價格之差的加總", "explain": "CS = (r1-p)+(r2-p)+(r3-p) = v(3)-v(0)-3p，即介於需求與價格之間的面積。"}, {"q": "教材以哪兩種貨幣測度衡量效用變化，作為消費者剩餘近似不足時的替代？", "options": ["補償變量與等值變量", "邊際效用與總效用", "名目所得與實質所得", "邊際成本與平均成本"], "answer": "補償變量與等值變量", "explain": "當偏好非準線性、近似不夠好時，改用補償變量（C）與等值變量（E）兩種貨幣測度。"}, {"q": "生產者剩餘在圖形上是哪個面積？", "options": ["介於價格與供給曲線之間的面積", "需求曲線下方全部面積", "價格線以上、需求曲線以下的面積", "總成本曲線下方面積"], "answer": "介於價格與供給曲線之間的面積", "explain": "以出售稟賦角度，生產者剩餘為價格與供給曲線之間的面積，衡量出售相對於不出售的所得。"}]}, {"num": 15, "title_en": "Market Demand", "title_zh": "市場需求", "summary": "市場需求（market demand）是所有個別消費者需求的加總，因此會取決於所得的分配。為衡量需求對價格的反應，本章引入價格彈性（price elasticity），因斜率 dx/dp 非單位自由（not unit free），故改用百分比變化之比 (Δx/x)/(Δp/p)。彈性絕對值大於 1 為富有彈性（elastic）、等於 1 為單位彈性（unit elastic）、小於 1 為缺乏彈性（inelastic）。以線性需求為例，中點處彈性為 1，價高於中點時彈性大於 1、價低於中點時彈性小於 1。邊際收益（MR）與彈性關係為 MR=p(1-1/|ε|)：彈性等於 1 時 MR=0、大於 1 時 MR>0、小於 1 時 MR<0。本章亦定義所得彈性（income elasticity）：大於 0 為正常財、小於 0 為劣等財、大於 1 為奢侈品，且因預算限制，以支出比重為權數的所得彈性加權平均恆等於 1。", "key_terms": [{"term_en": "Market Demand", "term_zh": "市場需求", "def": "所有個別消費者需求的加總 x(p1,p2,m1,...,mn)=x1+x2+...+xn；其大小取決於所得在消費者間的分配。"}, {"term_en": "Price Elasticity of Demand", "term_zh": "需求的價格彈性", "def": "需求量對價格反應的單位自由測度，定義為 (Δx/x)/(Δp/p)；對多數需求為負值，有時為方便忽略負號。"}, {"term_en": "Elastic / Unit Elastic / Inelastic", "term_zh": "富有彈性／單位彈性／缺乏彈性", "def": "彈性絕對值 |ε|>1 為富有彈性、|ε|=1 為單位彈性、|ε|<1 為缺乏彈性。"}, {"term_en": "Marginal Revenue (MR)", "term_zh": "邊際收益", "def": "收益對數量的變化率 dR/dx=p+(dp/dx)x=p(1-1/|ε|)（需求負斜率時）；反映每增加一單位銷售的收益變化。"}, {"term_en": "Income Elasticity", "term_zh": "所得彈性", "def": "需求量對所得反應的測度 (Δx/x)/(Δm/m)；>0 為正常財、<0 為劣等財、>1 為奢侈品。"}], "key_points": ["市場需求為個別需求的水平加總，並取決於所得分配。", "價格斜率 dx/dp 非單位自由，故以彈性 (Δx/x)/(Δp/p) 衡量價格反應；多數需求彈性為負。", "線性需求 x=a-bp 在中點 p=a/2b 處彈性為 1；價高於中點彈性>1，價低於中點彈性<1。", "邊際收益 MR=p(1-1/|ε|)：|ε|=1 時 MR=0，|ε|>1 時 MR>0，|ε|<1 時 MR<0。", "所得彈性>0 為正常財、<0 為劣等財、>1 為奢侈品。", "由預算限制 p1x1+p2x2=m，可導出以支出比重為權數的所得彈性加權平均恆等於 1，故所得彈性傾向聚集在 1 附近。"], "flashcards": [{"q": "為何不用斜率 dx/dp 而改用彈性衡量需求對價格的反應？", "a": "因為斜率非單位自由（not unit free），而彈性 (Δx/x)/(Δp/p) 是百分比之比，為單位自由的測度。"}, {"q": "線性需求曲線上彈性等於 1 的位置在哪裡？", "a": "在中點 p=a/2b 處，彈性絕對值為 1。"}, {"q": "邊際收益與價格彈性的關係式為何？", "a": "MR=p(1-1/|ε|)（需求為負斜率時）。"}, {"q": "所得彈性如何區分正常財、劣等財與奢侈品？", "a": ">0 為正常財、<0 為劣等財、>1 為奢侈品。"}, {"q": "為何所得彈性常聚集在 1 附近？", "a": "因預算限制使以支出比重為權數的所得彈性加權平均恆等於 1。"}], "quiz": [{"q": "市場需求取決於下列何者？", "options": ["所得的分配", "只取決於總所得而與分配無關", "廠商數目", "生產技術"], "answer": "所得的分配", "explain": "市場需求為個別需求加總，其大小取決於所得在各消費者間的分配。"}, {"q": "當 |ε|=1（單位彈性）時，邊際收益 MR 為何？", "options": ["MR=0", "MR>0", "MR<0", "MR=p"], "answer": "MR=0", "explain": "由 MR=p(1-1/|ε|)，當 |ε|=1 時 1-1/|ε|=0，故 MR=0。"}, {"q": "線性需求曲線上，價格高於中點時彈性為何？", "options": ["|ε|>1（富有彈性）", "|ε|=1（單位彈性）", "|ε|<1（缺乏彈性）", "彈性為 0"], "answer": "|ε|>1（富有彈性）", "explain": "線性需求在中點彈性為 1，價高於中點時 |ε|>1，價低於中點時 |ε|<1。"}, {"q": "所得彈性大於 1 的財貨稱為？", "options": ["奢侈品", "劣等財", "季芬財", "正常必需品"], "answer": "奢侈品", "explain": "所得彈性>0 為正常財、<0 為劣等財、其中>1 者為奢侈品（luxury）。"}]}, {"num": 16, "title_en": "Equilibrium", "title_zh": "市場均衡", "summary": "本章討論市場均衡與其效率性質。均衡可由消費者剩餘與生產者剩餘的變化來分析，得到與供需分析相同的結論。核心是柏瑞圖效率（Pareto efficiency）：若消費者的邊際願付價格（MWP，marginal willingness to pay）不等於生產者的邊際願售價格（MWS，marginal willingness to sell），則非效率——例如當 MWP>MWS，消費者與生產者可在兩者之間議定一個價格多生產一單位，使消費者更好、生產者利潤更多。就生產者而言，若兩生產者的 MWS 不相等（如 5>4），將生產由高成本者移轉給低成本者可節省資源。市場透過價格機制使所有生產者的 MWS 相等，因為 MWS1=p=MWS2。", "key_terms": [{"term_en": "Market Equilibrium", "term_zh": "市場均衡", "def": "供給與需求相等時的市場狀態；其福利結果可用消費者剩餘與生產者剩餘的變化來分析，並與供需分析結論一致。"}, {"term_en": "Pareto Efficiency", "term_zh": "柏瑞圖效率", "def": "無法在不使任何人變差的前提下使某人變好的狀態；當 MWP≠MWS 時即有改善空間，故非效率。"}, {"term_en": "Marginal Willingness to Pay (MWP)", "term_zh": "邊際願付價格", "def": "消費者為多消費一單位所願意支付的最高價格；效率要求其等於生產者的邊際願售價格。"}, {"term_en": "Marginal Willingness to Sell (MWS)", "term_zh": "邊際願售價格", "def": "生產者多生產（出售）一單位所要求的最低價格，反映其邊際成本；效率要求各生產者 MWS 相等且等於價格。"}], "key_points": ["均衡的福利結論可由消費者剩餘與生產者剩餘的變化推得，與供需分析一致。", "若 MWP≠MWS 即非柏瑞圖效率：當 MWP>MWS，消費者與生產者可在中間議價多生產一單位，雙方皆受益。", "生產面上，若兩生產者 MWS 不相等（如 5>4），將生產由高成本者移轉給低成本者可節省成本（資源）。", "被節省下來的資源可用於增加生產，故 MWS 不相等代表存在改善（效率提升）的空間。", "市場透過價格機制使所有生產者的邊際願售價格相等：MWS1=p=MWS2，達到生產效率。"], "flashcards": [{"q": "除了供需分析，還可用什麼來達到相同的均衡效率結論？", "a": "計算消費者剩餘與生產者剩餘的變化。"}, {"q": "當 MWP>MWS 時為何非效率？", "a": "因為消費者與生產者可在兩者之間議定價格多生產一單位，使消費者更好、生產者利潤更多。"}, {"q": "若兩生產者 MWS1=5、MWS2=4，如何改善？", "a": "由生產者 2 多生產一單位（成本+4）、生產者 1 減產一單位（成本-5），總共節省 1 元成本（資源）。"}, {"q": "市場如何使各生產者的邊際願售價格相等？", "a": "透過價格機制，因 MWS1=p=MWS2，所有生產者的 MWS 都等於市場價格。"}], "quiz": [{"q": "以下何者為柏瑞圖效率在市場均衡的條件？", "options": ["MWP=MWS", "MWP>MWS", "MWP<MWS", "MWP 與 MWS 無關"], "answer": "MWP=MWS", "explain": "當邊際願付價格等於邊際願售價格時才具效率；不相等則存在互利的交易改善空間。"}, {"q": "當 MWP>MWS 時會發生什麼？", "options": ["可多生產一單位使消費者與生產者皆受益", "已達效率，無需調整", "應減少生產", "價格必須為零"], "answer": "可多生產一單位使消費者與生產者皆受益", "explain": "MWP>MWS 表示消費者願付高於生產者願售，可在中間議價多生產一單位，雙方皆更好。"}, {"q": "若 MWS1=5、MWS2=4，將生產在兩者間重新配置的效果為何？", "options": ["總成本可節省 1 元資源", "總成本增加 1 元", "無任何影響", "產量必然下降"], "answer": "總成本可節省 1 元資源", "explain": "由高成本者（5）減產、低成本者（4）增產，淨節省 1 元成本，被節省的資源可用於增產。"}, {"q": "市場達到生產效率時，各生產者的邊際願售價格與價格的關係為何？", "options": ["MWS1=p=MWS2", "MWS1>p>MWS2", "MWS 與 p 無關", "MWS1<p<MWS2"], "answer": "MWS1=p=MWS2", "explain": "市場透過價格機制使所有生產者的邊際願售價格都等於市場價格，故 MWS1=p=MWS2。"}]}, {"num": 17, "title_en": "Measurement", "title_zh": "計量（需求的估計）", "summary": "本章討論如何從資料估計需求，以及過程中的統計陷阱。首先是辛普森悖論（Simpson's paradox）：某趨勢在各分組資料中出現，但將各組合併後卻消失或反轉。以折價券為例，會費心使用折價券的人可能比不用的人對價格更敏感（更具選擇性），因此基於此選擇性群體所做的推論未必能直接推廣到整體母體。其次是辨識問題（identification problem）：估計需求時需要有能移動供給的因素（供給移動因子）；但若供給與需求兩條曲線同時移動，就無法辨識究竟是什麼在驅動價格變化。", "key_terms": [{"term_en": "Simpson's Paradox", "term_zh": "辛普森悖論", "def": "機率與統計上的悖論：某趨勢在不同分組資料中出現，但當各組合併時卻消失或反轉。"}, {"term_en": "Selection / Selective Group", "term_zh": "選擇性群體（樣本選擇）", "def": "樣本並非隨機而具特定傾向，如願意費心使用折價券者往往較對價格敏感，導致其推論不易推廣到母體。"}, {"term_en": "Identification Problem", "term_zh": "辨識問題", "def": "估計需求時需有能移動供給的因素；若供需兩曲線同時移動，便無法辨識價格變化的真正驅動來源。"}, {"term_en": "Supply Shifter", "term_zh": "供給移動因子", "def": "只移動供給曲線而不移動需求曲線的變數，用以追蹤出需求曲線、正確估計需求。"}], "key_points": ["辛普森悖論：趨勢在各分組中成立，合併後卻可能消失或反轉。", "以折價券為例，使用折價券者可能比不使用者更對價格敏感。", "基於此類選擇性群體的推論未必能直接推廣到整體母體。", "估計需求時需要能移動供給的因素（供給移動因子）以辨識出需求曲線。", "若供給與需求同時移動，將無法辨識是什麼在驅動價格的變化（辨識問題）。"], "flashcards": [{"q": "什麼是辛普森悖論（Simpson's paradox）？", "a": "某趨勢在不同分組資料中出現，但將各組合併後卻消失或反轉的統計悖論。"}, {"q": "為何折價券使用者的資料可能造成誤導？", "a": "因為願意費心使用折價券者可能比不使用者更對價格敏感，屬選擇性群體，推論難以推廣到母體。"}, {"q": "要正確估計需求，需要什麼樣的變數？", "a": "需要能移動供給（而不移動需求）的因素，即供給移動因子。"}, {"q": "辨識問題（identification problem）發生在什麼情況？", "a": "當供給與需求兩條曲線同時移動時，就無法辨識是什麼在驅動價格變化。"}], "quiz": [{"q": "辛普森悖論描述的是什麼現象？", "options": ["趨勢在各分組出現，合併後卻消失或反轉", "價格上升需求上升", "供給等於需求", "彈性恆等於 1"], "answer": "趨勢在各分組出現，合併後卻消失或反轉", "explain": "辛普森悖論即分組資料的趨勢在合併後消失或反轉的統計現象。"}, {"q": "為什麼以折價券使用者為樣本的推論可能有偏誤？", "options": ["他們可能比一般人更對價格敏感，屬選擇性群體", "他們的所得一定較高", "折價券沒有折扣", "樣本數一定太大"], "answer": "他們可能比一般人更對價格敏感，屬選擇性群體", "explain": "會費心使用折價券者往往較對價格敏感，屬選擇性群體，推論不易推廣到母體。"}, {"q": "為正確估計需求曲線，最需要下列何者？", "options": ["能移動供給的因素（供給移動因子）", "能移動需求的因素", "固定的價格", "同時移動供需的因素"], "answer": "能移動供給的因素（供給移動因子）", "explain": "供給移動而需求不動時，觀察到的價量點會沿著需求曲線移動，才能辨識需求。"}, {"q": "辨識問題最可能在何種情況下發生？", "options": ["供給與需求同時移動", "只有供給移動", "只有需求移動", "價格固定不變"], "answer": "供給與需求同時移動", "explain": "若兩條曲線同時移動，便無法辨識究竟是什麼在驅動價格變化。"}]}, {"num": 18, "title_en": "Auctions", "title_zh": "拍賣", "summary": "本章探討拍賣機制。核心概念：在私有價值（private-value）的第二價格拍賣（second price auction）中，誠實出價是最佳策略（honesty is the best policy）；但在共同價值（common-value）拍賣中，可能出現贏家的詛咒（winner's curse）。設有 n 位競標者，其私有價值為 v1,...,vn，賣方對物品價值為零。就柏瑞圖效率而言，物品應賣給估值最高者（若 v1>v2>...>vn 則賣給第 1 位）；若賣方目標為極大化利潤則向第 1 位收 v1，若為效率則第 1 位得標而付價無所謂。在共同價值拍賣中，估值為 v+ei（v 為共同價值、ei 為誤差），若各人依估值出價，誤差最大（emax>0）者得標卻付出高於真值 v 的價格，即贏家的詛咒；為避免之，競標者應壓低出價（shade bids），且競標者越多越應壓低。本章並將拍賣延伸至機制設計（mechanism design），視其為賽局理論的「逆問題」：賽局理論由給定的賽局求均衡結果，機制設計則由想達成的結果反向設計賽局使其均衡即為該結果。", "key_terms": [{"term_en": "Second Price Auction", "term_zh": "第二價格拍賣", "def": "出價最高者得標，但只需支付第二高的出價；在私有價值下，誠實出價（bid your true value）為最佳策略。"}, {"term_en": "Private-Value / Common-Value Auction", "term_zh": "私有價值／共同價值拍賣", "def": "私有價值指每位競標者對物品有自己的獨立價值；共同價值指物品有一共同真值 v，各人僅有帶誤差的估計 v+ei。"}, {"term_en": "Winner's Curse", "term_zh": "贏家的詛咒", "def": "在共同價值拍賣中，若依估值出價，誤差最大者得標卻付出高於真值的價格（因 emax>0）；為避免須壓低出價。"}, {"term_en": "Shading Bids", "term_zh": "壓低出價", "def": "為避免贏家的詛咒而故意把出價壓得低於自己的估值；競標者越多，越應壓得更低。"}, {"term_en": "Mechanism Design", "term_zh": "機制設計", "def": "賽局理論的逆問題：由想達成的結果反向設計一個賽局，使其均衡結果恰為該想要的結果。"}], "key_points": ["私有價值第二價格拍賣中，誠實出價是最佳策略（honesty is the best policy）。", "共同價值拍賣中可能出現贏家的詛咒；避免之道是壓低出價，且競標者越多越應壓低。", "設 v1>v2>...>vn，效率要求物品賣給估值最高的第 1 位。", "若賣方知道所有價值，設計問題即為瑣碎：欲極大利潤向第 1 位收 v1；欲極大效率則第 1 位得標而付價無所謂。", "共同價值下估值為 v+ei，依估值出價時 emax>0 者得標卻付出高於真值 v 的價格，即贏家的詛咒。", "類 Vickrey 的線上代理競標中，理論上最高價值者得標並支付第二高價值，誠實揭露為最佳。", "機制設計是賽局理論的逆問題：由想要的結果反向設計賽局，使其均衡即為該結果。"], "flashcards": [{"q": "在私有價值第二價格拍賣中，最佳策略是什麼？", "a": "誠實出價（出自己的真實價值）——「誠實是最佳策略」。"}, {"q": "什麼是贏家的詛咒（winner's curse）？", "a": "在共同價值拍賣中，依估值出價時，估計誤差最大者得標卻付出高於真值 v 的價格。"}, {"q": "如何避免贏家的詛咒？", "a": "壓低出價（shade bids），而且競標者越多，出價應壓得越低。"}, {"q": "若目標是效率，物品應賣給誰？付價重要嗎？", "a": "應賣給估值最高者（v1 最高的第 1 位）；就效率而言其支付的價格並不重要。"}, {"q": "機制設計與賽局理論的關係為何？", "a": "機制設計是賽局理論的逆問題：賽局理論由賽局求均衡，機制設計由想要的結果反向設計賽局。"}], "quiz": [{"q": "在私有價值的第二價格拍賣中，理性競標者應如何出價？", "options": ["誠實出價（出真實價值）", "遠低於真實價值", "遠高於真實價值", "隨機出價"], "answer": "誠實出價（出真實價值）", "explain": "第二價格拍賣的核心結論：私有價值下誠實出價為最佳策略。"}, {"q": "贏家的詛咒最可能發生在哪種拍賣？", "options": ["共同價值拍賣", "私有價值第二價格拍賣", "所有拍賣都不會發生", "只在賣方價值為正時"], "answer": "共同價值拍賣", "explain": "共同價值下估值含誤差，依估值出價時誤差最大者得標卻付出高於真值的價格，即贏家的詛咒。"}, {"q": "為避免贏家的詛咒，隨著競標者人數增加，應如何調整出價？", "options": ["把出價壓得更低", "把出價提得更高", "維持不變", "改為隨機出價"], "answer": "把出價壓得更低", "explain": "競標者越多，得標者越可能是估計最樂觀者，故應壓低出價以避免詛咒。"}, {"q": "機制設計（mechanism design）最貼切的描述為何？", "options": ["賽局理論的逆問題：由想要的結果反向設計賽局", "由賽局求出均衡結果", "估計需求曲線的方法", "計算消費者剩餘的方法"], "answer": "賽局理論的逆問題：由想要的結果反向設計賽局", "explain": "機制設計給定欲達成的結果，設計一個賽局使其均衡恰為該結果，故為賽局理論的逆問題。"}]}, {"num": 19, "title_en": "Technology", "title_zh": "生產技術", "summary": "本章介紹廠商的技術限制（technology constraint），為後續探討需求曲線與市場結構的基礎。以生產函數描述投入與產出的關係。固定比例（fixed proportion，完全互補 perfect complement）技術如挖洞需一人配一鏟，f(x1,x2)=min{x1,x2}，多餘的人或鏟皆無用。凸性（convexity）假設：若 (x1,x2) 與 (z1,z2) 兩種投入組合都能生產 y，則兩者的加權平均至少也能生產 y；在生產規模可自由調整、各生產程序互不干擾時，凸性是自然的假設。邊際產量（marginal product, MP1）為固定其他投入下多投入一單位要素 1 所增加的產出，是一種比率（如同邊際效用）。技術替代邊際率（marginal rate of technical substitution, MRTS）衡量兩投入間的取捨：在維持產出 y 不變下多用一點 x1 可少用多少 x2，MRTS1,2=-MP1/MP2，為一種斜率（如同 MRS）。", "key_terms": [{"term_en": "Technology Constraint", "term_zh": "技術限制", "def": "廠商由生產技術所面臨的限制，描述投入如何轉換為產出；為分析廠商行為的起點。"}, {"term_en": "Fixed Proportion (Perfect Complement)", "term_zh": "固定比例（完全互補）", "def": "投入須以固定比例搭配的技術，f(x1,x2)=min{x1,x2}；多餘的單一要素無法增加產出。"}, {"term_en": "Convexity", "term_zh": "凸性", "def": "若 (x1,x2) 與 (z1,z2) 都能生產 y，則其加權平均 (tx1+(1-t)z1, tx2+(1-t)z2) 至少也能生產 y；在可自由調整規模、程序互不干擾時為自然假設。"}, {"term_en": "Marginal Product (MP)", "term_zh": "邊際產量", "def": "固定其他投入下，要素 1 增加一單位所帶來的產出變化 MP1=(f(x1+Δx1,x2)-f(x1,x2))/Δx1；為一種比率，如同邊際效用。"}, {"term_en": "Marginal Rate of Technical Substitution (MRTS)", "term_zh": "技術替代邊際率", "def": "維持產出不變下，多用一單位 x1 可減少多少 x2；MRTS1,2=-MP1/MP2，為一種斜率，如同 MRS。"}], "key_points": ["先理解廠商的技術限制，再談消費者與競爭者所加諸的限制（需求曲線、市場結構）。", "固定比例（完全互補）技術 f(x1,x2)=min{x1,x2}，多餘的單一要素不增加產出。", "凸性：兩種能生產 y 的投入組合，其加權平均至少也能生產 y。", "當生產規模可自由縮放、各生產程序互不干擾時，凸性是自然的假設。", "邊際產量 MP1 為固定其他投入下多投入一單位要素 1 所增加的產出，是一種比率（如同邊際效用）。", "技術替代邊際率 MRTS 衡量兩投入間的取捨，MRTS1,2=-MP1/MP2，為一種斜率（如同 MRS）。"], "flashcards": [{"q": "固定比例（完全互補）技術的生產函數形式為何？", "a": "f(x1,x2)=min{x1,x2}；如一人配一鏟挖洞，多餘的人或鏟皆無用。"}, {"q": "生產技術的凸性（convexity）在說什麼？", "a": "若兩種投入組合都能生產 y，則其加權平均至少也能生產 y 單位的產出。"}, {"q": "何時凸性是自然的假設？", "a": "當生產規模可自由縮放、且各生產程序互不干擾時。"}, {"q": "邊際產量 MP1 的定義為何？它像什麼？", "a": "固定其他投入下，多投入一單位要素 1 所增加的產出；是一種比率，如同邊際效用（MU）。"}, {"q": "技術替代邊際率 MRTS1,2 的公式為何？它像什麼？", "a": "MRTS1,2=-MP1/MP2；是一種斜率，如同消費者理論的 MRS。"}], "quiz": [{"q": "固定比例（完全互補）技術的生產函數為下列何者？", "options": ["f(x1,x2)=min{x1,x2}", "f(x1,x2)=x1+x2", "f(x1,x2)=x1·x2", "f(x1,x2)=max{x1,x2}"], "answer": "f(x1,x2)=min{x1,x2}", "explain": "完全互補（固定比例）技術須以固定比例搭配投入，故產出由較少者決定，即 min{x1,x2}。"}, {"q": "生產技術的凸性假設意指？", "options": ["兩種能生產 y 的投入組合，其加權平均至少也能生產 y", "產出隨投入遞減", "投入必須完全互補", "邊際產量恆為零"], "answer": "兩種能生產 y 的投入組合，其加權平均至少也能生產 y", "explain": "凸性即：若 (x1,x2) 與 (z1,z2) 皆能生產 y，則其加權平均組合也能生產至少 y 的產出。"}, {"q": "邊際產量（MP）在性質上類比於消費者理論中的什麼？", "options": ["邊際效用（MU），皆為比率", "邊際替代率（MRS）", "預算限制", "消費者剩餘"], "answer": "邊際效用（MU），皆為比率", "explain": "教材指出 MP 是一種比率，就像邊際效用 MU。"}, {"q": "技術替代邊際率 MRTS1,2 等於下列何者？", "options": ["-MP1/MP2", "MP1·MP2", "MP1+MP2", "-MP2/MP1"], "answer": "-MP1/MP2", "explain": "維持產出不變下 MP1·Δx1+MP2·Δx2=0，解得 Δx2/Δx1=-MP1/MP2，即 MRTS1,2。"}]}, {"num": 20, "title_en": "Profit Maximization", "title_zh": "利潤極大化", "summary": "本章探討廠商如何選擇投入與產出以極大化利潤。廠商的目標是在生產集合的限制下，極大化總收益（產出價值）減去總成本（各要素以市場租用價格計價）。所有要素都應以其機會成本（市場價格）而非歷史成本評價，並以流量衡量。短期利潤極大化下，可變要素的邊際產值須等於其租用價格（pMP=w）；長期則每一要素皆須滿足此條件。若技術為固定規模報酬（CRS）且市場競爭，正利潤無法持續，因為加倍投入會導致矛盾。利潤極大化行為隱含「利潤極大化弱公理（WAPM）」，可用來還原生產函數，並推得供給向上傾斜、要素需求向下傾斜。最後指出：利潤極大化廠商必為成本極小化廠商，故可先對每個產量求成本極小，再選最適產量。", "key_terms": [{"term_en": "Profit Maximization", "term_zh": "利潤極大化", "def": "廠商在生產集合限制下，選擇投入與產出使總收益（Σp·y）減總成本（Σw·x）最大。"}, {"term_en": "Value of Marginal Product", "term_zh": "邊際產值", "def": "價格乘以要素的邊際產量（pMP）。利潤極大化的一階條件要求它等於該要素的租用價格 w。"}, {"term_en": "Opportunity Cost / Imputed Cost", "term_zh": "機會成本／設算成本", "def": "要素應以市場租用價格（如業主設算工資、機器設算租金）計價，反映機會成本而非歷史成本。"}, {"term_en": "Constant Returns to Scale (CRS)", "term_zh": "固定規模報酬", "def": "投入加倍則產出加倍。在競爭市場中，CRS 使長期正利潤無法持續（否則產生矛盾）。"}, {"term_en": "Weak Axiom of Profit Maximization (WAPM)", "term_zh": "利潤極大化弱公理", "def": "類比消費者理論的 WARP，利潤極大化行為所滿足的一致性條件，可用來還原生產函數並推得比較靜態性質。"}], "key_points": ["廠商目標是在生產集合限制下極大化利潤＝總收益減總成本。", "所有要素以市場租用價格（機會成本、流量）計價，而非歷史成本。", "短期一階條件：可變要素的邊際產值 pMP1 等於其租用價格 w1；若 pMP>w 則多用該要素，pMP<w 則少用。", "長期一階條件：每一要素皆滿足 pMPi=wi。", "在 CRS 與競爭下正利潤不能持續：投入加倍會使利潤加倍而產生矛盾；廠商若無限擴張，CRS 或競爭假設將不再成立。", "由 WAPM 可推得供給曲線向上傾斜、要素需求曲線向下傾斜。", "利潤極大化廠商必為成本極小化廠商，故可拆解為：先對每個 y 求成本極小，再選最適 y*。"], "flashcards": [{"q": "短期利潤極大化對可變要素的一階條件為何？", "a": "邊際產值等於租用價格，即 pMP1(x1*,k)=w1。"}, {"q": "要素應以何種成本計價？", "a": "以市場租用價格（機會成本、流量衡量），而非歷史成本；並須包含業主設算工資、機器設算租金。"}, {"q": "為何在 CRS 與競爭下長期正利潤無法持續？", "a": "若投入加倍則利潤加倍，與原本已達極大值矛盾；且擴張後 CRS 或競爭假設會失效。"}, {"q": "利潤極大化與成本極小化的關係為何？", "a": "利潤極大化廠商必為成本極小化廠商，可先對每個產量求成本極小，再選最適產量。"}, {"q": "WAPM 的用途是什麼？", "a": "類比 WARP，利潤極大化弱公理可用來還原生產函數，並推得供給向上傾斜、要素需求向下傾斜。"}], "quiz": [{"q": "廠商短期利潤極大化時，若某可變要素的邊際產值大於其租用價格（pMP1>w1），應如何調整？", "options": ["減少使用該要素", "增加使用該要素", "維持不變，已達最適", "停止生產"], "answer": "增加使用該要素", "explain": "pMP1>w1 表示多用一單位該要素帶來的收益大於成本，故應增加使用直到 pMP1=w1。"}, {"q": "關於要素計價，下列何者正確？", "options": ["以歷史（購入）成本計價", "以市場租用價格（機會成本）計價", "業主設算工資不計入", "以帳面折舊後價值計價"], "answer": "以市場租用價格（機會成本）計價", "explain": "課文強調要素應反映機會成本（市場價格）而非歷史成本，並包含業主設算工資與機器設算租金。"}, {"q": "在固定規模報酬且競爭的假設下，長期均衡利潤應為何？", "options": ["恆為正", "為零（否則產生矛盾）", "恆為負", "無法確定"], "answer": "為零（否則產生矛盾）", "explain": "若有正利潤，投入加倍會使利潤加倍而與極大化矛盾；故競爭 CRS 下長期利潤為零。"}, {"q": "WAPM（利潤極大化弱公理）主要可用來做什麼？", "options": ["計算消費者剩餘", "還原生產函數並推得供給/要素需求的斜率性質", "決定市場均衡價格", "衡量獨占者的邊際收益"], "answer": "還原生產函數並推得供給/要素需求的斜率性質", "explain": "課文指出 WAPM 類比 WARP，可幫助還原生產函數，並得到供給向上傾斜、要素需求向下傾斜。"}]}, {"num": 21, "title_en": "Cost Minimization", "title_zh": "成本極小化", "summary": "本章將利潤極大化拆解為兩步驟：先對每個產量 y 求成本極小化，再選最適產量 y*。成本極小化的最適條件為等產量線與等成本線相切，即技術替代率 MRTS 等於要素價格比 -w1/w2；重排後得到 MP1/w1=MP2/w2，意即花在任一要素上的最後一元錢帶來相同的額外產出。在遞增規模報酬（IRS）下，加倍投入產出超過加倍，故產量加倍時成本不到加倍，平均成本（AC）隨產量上升而下降。透過成本極小化的一致性（類似 WAPM）可證明條件要素需求曲線向下傾斜。短期若固定要素恰好等於長期成本極小的水準，則短期無額外限制，短期與長期成本相同；一般而言短期成本高於或等於長期成本。", "key_terms": [{"term_en": "Cost Minimization", "term_zh": "成本極小化", "def": "對給定產量 y，選擇投入組合使總成本 w1x1+w2x2 最小；為利潤極大化的第一步。"}, {"term_en": "Marginal Rate of Technical Substitution (MRTS)", "term_zh": "邊際技術替代率", "def": "維持產量不變下，兩要素的替換比率，等於 -MP1/MP2；最適時等於要素價格比 -w1/w2。"}, {"term_en": "Tangency Condition", "term_zh": "相切條件", "def": "成本極小的最適點為等產量線與等成本線相切，滿足 MP1/w1=MP2/w2。"}, {"term_en": "Conditional Factor Demand", "term_zh": "條件要素需求", "def": "在給定產量下使成本極小的要素需求量；由一致性可證其對自身價格向下傾斜。"}, {"term_en": "Increasing Returns to Scale (IRS)", "term_zh": "遞增規模報酬", "def": "投入加倍則產出超過加倍；此時產量增加使平均成本下降。"}], "key_points": ["利潤極大化拆為兩步：先對每個 y 求成本極小，再選最適 y*。", "成本極小的相切條件：MRTS1,2 = -MP1/MP2 = -w1/w2。", "重排得 MP1/w1=MP2/w2：花在任一要素上的最後一元錢帶來相同的額外產出。", "在 IRS 下，產量加倍所需投入不到加倍，成本不到加倍，故 AC 隨產量上升而下降。", "由成本極小化的一致性（類 WAPM）可證條件要素需求曲線向下傾斜。", "短期若固定要素恰為長期成本極小水準，短期無額外限制，短期成本＝長期成本。", "一般而言短期成本 cs(x2,y) ≥ 長期成本 c(y)；因短期也可選 x1(y)，故 cs(x2(y),y)=c(y)。"], "flashcards": [{"q": "成本極小化的相切（最適）條件為何？", "a": "MRTS1,2 = -MP1/MP2 = -w1/w2，即等產量線與等成本線相切。"}, {"q": "MP1/w1=MP2/w2 的經濟意義是什麼？", "a": "花在招募要素1或要素2上的最後一元錢，會帶來相同的額外產出。"}, {"q": "在遞增規模報酬（IRS）下，平均成本如何隨產量變化？", "a": "AC 隨產量上升而下降，因為產出加倍所需投入不到加倍，成本不到加倍。"}, {"q": "條件要素需求曲線的斜率為何？", "a": "向下傾斜；由成本極小化的一致性條件可證得。"}, {"q": "何時短期成本會等於長期成本？", "a": "當固定要素恰好等於長期成本極小的水準時，短期無額外限制，故 cs(x2(y),y)=c(y)。"}], "quiz": [{"q": "成本極小化的最適條件為下列何者？", "options": ["MP1=MP2", "MRTS = -w1/w2（等產量線與等成本線相切）", "w1=w2", "p=MC"], "answer": "MRTS = -w1/w2（等產量線與等成本線相切）", "explain": "最適點為相切，MRTS1,2 = -MP1/MP2 = -w1/w2，重排得 MP1/w1=MP2/w2。"}, {"q": "MP1/w1=MP2/w2 代表什麼？", "options": ["兩要素邊際產量相等", "兩要素價格相等", "花在任一要素上的最後一元錢帶來相同額外產出", "產量最大化"], "answer": "花在任一要素上的最後一元錢帶來相同額外產出", "explain": "此為成本極小的等邊際原理：每一元支出在各要素上的邊際貢獻相同。"}, {"q": "在遞增規模報酬下，隨產量增加平均成本會如何？", "options": ["上升", "下降", "不變", "先升後降"], "answer": "下降", "explain": "IRS 下產出加倍所需投入不到加倍，成本不到加倍，故 AC 隨 y 上升而下降。"}, {"q": "關於短期與長期成本，下列何者正確？", "options": ["短期成本恆低於長期成本", "一般短期成本 ≥ 長期成本；固定要素為最適水準時兩者相等", "兩者恆相等", "短期成本與長期成本無關"], "answer": "一般短期成本 ≥ 長期成本；固定要素為最適水準時兩者相等", "explain": "短期多一項固定要素限制，故成本較高；當固定要素恰為長期成本極小水準時 cs(x2(y),y)=c(y)。"}]}, {"num": 22, "title_en": "Cost Curves", "title_zh": "成本曲線", "summary": "本章分析各種成本曲線及其關係。總成本 cs(y)=cv(y)+F，其中 cv 為可變成本、F 為固定成本。邊際成本 MC 為總成本（或可變成本）對產量的導數，因固定成本不隨產量變動，故 MC(y)=MVC(y)。所有平均與邊際成本單位皆為「元/產出」。MC(0)=AVC(0)。平均可變成本 AVC 與平均成本 AC 的變化取決於與 MC 的比較：MC<AVC 時 AVC 遞減，MC>AVC 時 AVC 遞增，MC=AVC 時 AVC 最低（平坦）；AC 亦同理。將 MC 對產量積分可得可變成本（因 cv(0)=0，MC 曲線下面積即為可變成本）。以 cv(y)=y²、F=1 的例子說明：AVC=y、AC=y+1/y、MC=2y，AC 在 y=1 處最小。長期成本曲線是各種短期成本曲線的下包絡線，且長期 MC 與短期 MC 在最適廠房規模處重合。", "key_terms": [{"term_en": "Marginal Cost (MC)", "term_zh": "邊際成本", "def": "多生產一單位產出所增加的成本，MC(y)=dcv(y)/dy；因固定成本不變，MC=MVC。"}, {"term_en": "Average Variable Cost (AVC)", "term_zh": "平均可變成本", "def": "可變成本除以產量 cv(y)/y；MC<AVC 時遞減、MC>AVC 時遞增、MC=AVC 時最低。"}, {"term_en": "Average Cost (AC)", "term_zh": "平均成本", "def": "總成本除以產量 (cv(y)+F)/y；與 MC 的比較決定其升降，MC=AC 時 AC 最低。"}, {"term_en": "Fixed / Variable Cost", "term_zh": "固定成本／可變成本", "def": "cs(y)=cv(y)+F。固定成本 F 不隨產量變動，可變成本 cv(y) 隨產量變動且 cv(0)=0。"}, {"term_en": "Envelope (Long-run cost)", "term_zh": "（長期成本）包絡線", "def": "長期成本曲線為各短期成本曲線的下包絡線；長期 MC 與短期 MC 在最適廠房規模處重合。"}], "key_points": ["總成本 cs(y)=cv(y)+F；固定成本 F 不隨產量變動。", "MC(y)=MVC(y)，因固定成本對產量的導數為零；所有平均與邊際成本單位皆為元/產出。", "MC(0)=AVC(0)（類比第15章 MR(0)=AR(0)）。", "AVC：MC<AVC 遞減、MC>AVC 遞增、MC=AVC 平坦（最低）；AC 同理與 MC 比較。", "MC 曲線下的面積等於可變成本（因 cv(0)=0，積分 MC 得 cv(y)）。", "例：cv=y²、F=1 → AVC=y、AC=y+1/y、MC=2y，AC 在 y=1 最小。", "長期成本曲線為短期成本曲線的下包絡線；長期 MC 與短期 MC 在最適廠房規模處重合。"], "flashcards": [{"q": "為何 MC(y)=MVC(y)？", "a": "因固定成本 F 不隨產量變動，其對產量的導數為零，故總成本與可變成本的邊際相同。"}, {"q": "AVC 遞減、遞增、最低分別對應 MC 的什麼關係？", "a": "MC<AVC 時 AVC 遞減；MC>AVC 時 AVC 遞增；MC=AVC 時 AVC 平坦（最低）。"}, {"q": "MC 曲線下的面積代表什麼？", "a": "代表可變成本 cv(y)（因 cv(0)=0，將 MC 積分即得可變成本）。"}, {"q": "在 cv(y)=y²、F=1 的例子中，AC、MC、AVC 各為何？AC 何時最小？", "a": "AVC=y、AC=y+1/y、MC=2y；AC 在 y=1 處最小。"}, {"q": "長期成本曲線與短期成本曲線的關係為何？", "a": "長期成本曲線是各短期成本曲線的下包絡線；長期 MC 與短期 MC 在最適廠房規模處重合。"}], "quiz": [{"q": "為何邊際成本等於邊際可變成本（MC=MVC）？", "options": ["因為沒有固定成本", "因為固定成本不隨產量變動，導數為零", "因為可變成本恆為零", "因為產量為零"], "answer": "因為固定成本不隨產量變動，導數為零", "explain": "cs=cv+F，對 y 微分時 F 為常數，dF/dy=0，故 MC=dcv/dy=MVC。"}, {"q": "當 MC>AC 時，平均成本 AC 如何變化？", "options": ["遞減", "遞增", "不變", "為零"], "answer": "遞增", "explain": "由 dAC/dy=[MC-AC]/y，MC>AC 時分子為正，AC 遞增；MC=AC 時 AC 最低。"}, {"q": "MC 曲線下方的面積等於下列何者？", "options": ["固定成本", "總成本", "可變成本", "利潤"], "answer": "可變成本", "explain": "對 MC 積分且 cv(0)=0，得 cv(y)=∫MC(x)dx，故 MC 下面積為可變成本。"}, {"q": "在 cv(y)=y²、F=1 的例子中，平均成本 AC(y) 於何處最小？", "options": ["y=0", "y=1", "y=2", "y=1/2"], "answer": "y=1", "explain": "AC=y+1/y，一階條件 1-(1/y²)=0 得 y=1。"}]}, {"num": 23, "title_en": "Firm Supply", "title_zh": "廠商供給", "summary": "本章推導競爭廠商的供給曲線與生產者剩餘。廠商為價格接受者，短期利潤極大化 max py-cs(y) 的一階條件為 p=MC(y)，二階條件為 MC 遞增（MC'(y)>0）。兩項但書：供給只落在 MC 向上傾斜的部分；且廠商可能停業。停業條件為 p<AVC，故短期供給曲線是位於 AVC 之上、MC 向上傾斜的部分。生產者剩餘為收益減可變成本 py-cv(y)，可用三種方式衡量：收益減可變成本、收益減 MC 曲線下面積、或兩者的組合。長期廠商有退出選項，故須 py-c(y)≥0，即 p≥AC，長期供給曲線是位於 AC 之上、長期 MC 向上傾斜的部分。以 c(y)=y²+1 為例，MC=2y，供給 S(p)=p/2，生產者剩餘 PS=p²/4。", "key_terms": [{"term_en": "Firm Supply Curve", "term_zh": "廠商供給曲線", "def": "短期為位於 AVC 之上、MC 向上傾斜的部分；長期為位於 AC 之上、長期 MC 向上傾斜的部分。"}, {"term_en": "Shutdown Condition", "term_zh": "停業條件", "def": "當價格低於平均可變成本（p<AVC）時廠商停業；供給須滿足 p=MC>AVC。"}, {"term_en": "Producer's Surplus (PS)", "term_zh": "生產者剩餘", "def": "收益減可變成本 py-cv(y)；可用收益減可變成本、收益減 MC 下面積、或兩者組合三種方式衡量。"}, {"term_en": "Price equals Marginal Cost (p=MC)", "term_zh": "價格等於邊際成本", "def": "競爭廠商利潤極大化的一階條件；二階條件要求 MC 遞增（MC'(y)>0）。"}, {"term_en": "Long-run Supply", "term_zh": "長期供給", "def": "長期廠商有退出選項，須 py-c(y)≥0 即 p≥AC；供給為 AC 之上、長期 MC 向上傾斜的部分。"}], "key_points": ["競爭廠商為價格接受者，短期利潤極大化一階條件 p=MC(y)，二階條件 MC'(y)>0（MC 遞增）。", "兩項但書：供給只落在 MC 向上傾斜部分；廠商可能停業。", "停業條件 p<AVC；故短期供給是位於 AVC 之上、MC 向上傾斜的部分。", "生產者剩餘 = py-cv(y)，有三種衡量方式：收益減可變成本、收益減 MC 下面積、兩者組合。", "長期有退出選項，須 py-c(y)≥0 即 p≥AC。", "長期供給曲線是位於 AC 之上、長期 MC 向上傾斜的部分。", "例：c(y)=y²+1、MC=2y → S(p)=p/2、PS=p²/4。"], "flashcards": [{"q": "競爭廠商短期利潤極大化的一階與二階條件為何？", "a": "一階：p=MC(y)；二階：MC 遞增，MC'(y)>0。"}, {"q": "短期廠商的停業條件與供給曲線為何？", "a": "當 p<AVC 時停業；短期供給是位於 AVC 之上、MC 向上傾斜的部分。"}, {"q": "生產者剩餘的定義與三種衡量方式為何？", "a": "定義為 py-cv(y)；三種方式：收益減可變成本、收益減 MC 曲線下面積、或兩者的組合。"}, {"q": "長期供給曲線落在哪個區段？", "a": "位於 AC（平均成本）之上、長期 MC 向上傾斜的部分（因有退出選項須 p≥AC）。"}, {"q": "在 c(y)=y²+1 的例子中，供給函數與生產者剩餘各為何？", "a": "MC=2y → S(p)=p/2；生產者剩餘 PS=p²/4。"}], "quiz": [{"q": "競爭廠商短期供給曲線是 MC 的哪一部分？", "options": ["位於 AC 之上、向上傾斜部分", "位於 AVC 之上、向上傾斜部分", "整條 MC 曲線", "MC 向下傾斜部分"], "answer": "位於 AVC 之上、向上傾斜部分", "explain": "短期停業條件為 p<AVC，故短期供給是位於 AVC 之上、MC 向上傾斜的部分。"}, {"q": "生產者剩餘（PS）的定義為何？", "options": ["收益減總成本", "收益減固定成本", "收益減可變成本 py-cv(y)", "收益減平均成本"], "answer": "收益減可變成本 py-cv(y)", "explain": "課文定義生產者剩餘為 py-cv(y)，可用三種等價方式衡量。"}, {"q": "在 c(y)=y²+1 的例子中，廠商供給函數 S(p) 為何？", "options": ["S(p)=p", "S(p)=p/2", "S(p)=2p", "S(p)=p²"], "answer": "S(p)=p/2", "explain": "MC=2y，由 p=MC=2y 得 y=p/2，故 S(p)=p/2。"}, {"q": "長期廠商供給曲線落在哪個門檻之上？", "options": ["AVC（平均可變成本）", "AFC（平均固定成本）", "AC（平均成本）", "MC 最低點以下"], "answer": "AC（平均成本）", "explain": "長期有退出選項須 py-c(y)≥0 即 p≥AC，故長期供給位於 AC 之上、長期 MC 向上傾斜部分。"}]}, {"num": 24, "title_en": "Industry Supply", "title_zh": "產業供給", "summary": "本章討論產業（市場）供給曲線的加總。短期產業供給 S(p)=ΣSi(p)，只需將各廠商的供給曲線水平加總即可。但長期則不能如此簡單加總，因為在自由進出（free entry / free exit）下，廠商數目 n 未知——我們不知道產業中有多少廠商。因此長期改問：可能的長期均衡有哪些？若有正利潤時廠商會進入，則相關的交點是「與非負利潤一致的最低價格」（約等於最低平均成本）。在此長期均衡中，利潤為零並不代表產業消失，只是不再產生吸引新進入者的額外報酬；所有生產要素都以其市場價格（與在他處能賺得的相同）獲得報償，業主仍收取其勞動時間的報酬與投資的回報。", "key_terms": [{"term_en": "Industry Supply", "term_zh": "產業供給", "def": "整個市場的供給曲線；短期為各廠商供給的水平加總 S(p)=ΣSi(p)。"}, {"term_en": "Horizontal Summation", "term_zh": "水平加總", "def": "在同一價格下把各廠商供給量相加得到產業供給；短期適用，長期因廠商數未知而不適用。"}, {"term_en": "Free Entry / Free Exit", "term_zh": "自由進入／自由退出", "def": "廠商可自由進出產業；使長期廠商數目 n 未知，故無法直接水平加總得長期供給。"}, {"term_en": "Long-run Equilibrium (Zero Profit)", "term_zh": "長期均衡（零利潤）", "def": "與非負利潤一致的最低價格（約等於最低 AC）；此時利潤為零，不吸引新進入者，但產業不消失。"}], "key_points": ["短期產業供給是各廠商供給曲線的水平加總 S(p)=ΣSi(p)。", "長期無法直接水平加總，因為自由進出使廠商數目 n 未知。", "長期改問：可能的長期均衡有哪些。", "若正利潤時廠商進入，則相關均衡為與非負利潤一致的最低價格（約最低 AC）。", "長期均衡利潤為零，但這不代表產業消失，只是不再產生吸引新進入者的額外報酬。", "零利潤時所有要素仍以市場價格獲得報償，與在他處能賺得的相同；業主仍收取勞動與投資的報酬。"], "flashcards": [{"q": "短期產業供給曲線如何得到？", "a": "把各廠商的供給曲線水平加總，S(p)=ΣSi(p)。"}, {"q": "為何長期產業供給不能像短期一樣直接水平加總？", "a": "因為自由進出使廠商數目 n 未知，我們不知道產業中有多少廠商。"}, {"q": "長期均衡的相關價格（若有正利潤即進入）為何？", "a": "與非負利潤一致的最低價格，約等於最低平均成本。"}, {"q": "長期零利潤是否代表產業消失？", "a": "不代表；只是不再產生吸引新進入者的額外報酬，產業仍存在。"}, {"q": "長期零利潤下，要素與業主的報酬如何？", "a": "所有要素以市場價格獲得報償（與他處相同）；業主仍收取其勞動時間報酬與投資回報。"}], "quiz": [{"q": "短期產業供給曲線如何構成？", "options": ["垂直加總各廠商供給", "水平加總各廠商供給 S(p)=ΣSi(p)", "取各廠商供給的平均", "取單一代表廠商供給"], "answer": "水平加總各廠商供給 S(p)=ΣSi(p)", "explain": "短期只需在同一價格下把各廠商供給量相加，即水平加總。"}, {"q": "為何長期產業供給不能直接水平加總？", "options": ["因為價格未知", "因為自由進出使廠商數目 n 未知", "因為成本函數不同", "因為需求未知"], "answer": "因為自由進出使廠商數目 n 未知", "explain": "自由進入與退出下，我們不知道產業中有多少廠商，故無法確定 n。"}, {"q": "在長期均衡中，市場價格趨近於下列何者？", "options": ["最高平均成本", "與非負利潤一致的最低價格（約最低 AC）", "邊際成本最高點", "平均可變成本最低點"], "answer": "與非負利潤一致的最低價格（約最低 AC）", "explain": "若正利潤引來進入，價格被壓到與非負利潤一致的最低水準，約等於最低平均成本。"}, {"q": "長期均衡利潤為零，下列敘述何者正確？", "options": ["產業會消失", "要素得不到報酬", "產業不消失，要素仍以市場價格獲得報償", "業主不再收取任何報酬"], "answer": "產業不消失，要素仍以市場價格獲得報償", "explain": "零利潤只表示無額外報酬吸引新進入者；要素與業主仍以市場價格獲得應得報償。"}]}, {"num": 25, "title_en": "Monopoly", "title_zh": "獨占", "summary": "本章分析獨占廠商的行為與無效率。獨占者選擇產量使 MR(y)=MC(y)，其中 MR(y)=p(y)+p'(y)y。由於需求向下傾斜（p'(y)<0），多賣一單位須降價，且降價會減少先前所有單位的收益，故 MR(y)<p(y)=AR(y)。效率要求 p(y)=MC(y)，但獨占者用 p(y)+p'(y)y=MC，因 p'(y)y<0 而導致生產不足（underproduce），造成無效率。以彈性表示 MR=p[1+1/ε]，獨占者只會在需求彈性 |ε|>1 的區段生產。價格為 MC 的加成（markup）：p=MC/[1-1/|ε|]。由於面對給定需求會選擇單一最適產量，獨占者沒有供給曲線。線性需求 p=a-by 時 MR=a-2by（斜率為需求的兩倍）；此時對獨占者課稅 t，價格僅上升 t/2；但在固定彈性需求下（ε<-1），價格上升超過 t，即獨占者轉嫁超過稅額。", "key_terms": [{"term_en": "Monopoly", "term_zh": "獨占", "def": "市場唯一賣者，面對整條市場需求曲線，選擇產量使 MR(y)=MC(y)。"}, {"term_en": "Marginal Revenue (MR)", "term_zh": "邊際收益", "def": "MR(y)=p(y)+p'(y)y=p[1+1/ε]。因需求向下傾斜，MR<p=AR。"}, {"term_en": "Underproduction / Inefficiency", "term_zh": "生產不足／無效率", "def": "獨占者用 MR=MC 而非 p=MC，因 p'(y)y<0 而生產低於效率水準，造成無效率。"}, {"term_en": "Markup Pricing", "term_zh": "加成訂價", "def": "獨占價格為邊際成本的加成 p=MC/[1-1/|ε|]；獨占者只在 |ε|>1 的區段營運。"}, {"term_en": "No Supply Curve", "term_zh": "無供給曲線", "def": "獨占者對給定需求選擇單一最適產量，故談獨占者的供給曲線沒有意義。"}], "key_points": ["獨占者一階條件為 MR(y)=MC(y)，其中 MR(y)=p(y)+p'(y)y。", "因需求向下傾斜（p'(y)<0），MR(y)<p(y)=AR(y)。", "效率要求 p=MC，但獨占者用 p+p'(y)y=MC，故生產不足、造成無效率。", "以彈性表示 MR=p[1+1/ε]；獨占者只在需求彈性 |ε|>1 的區段生產。", "價格是 MC 的加成：p=MC/[1-1/|ε|]。", "獨占者沒有供給曲線，因對給定需求只選一個最適產量。", "線性需求下 MR=a-2by（斜率為需求兩倍），課稅 t 時價格僅升 t/2；但固定彈性需求下轉嫁超過 t。"], "flashcards": [{"q": "獨占者選擇產量的一階條件為何？", "a": "MR(y)=MC(y)，其中 MR(y)=p(y)+p'(y)y。"}, {"q": "為何獨占的邊際收益小於價格（MR<p）？", "a": "因需求向下傾斜，多賣一單位須降價，降價會減少先前所有單位的收益，故 MR=p+p'(y)y<p。"}, {"q": "為何獨占者會生產不足、造成無效率？", "a": "效率要求 p=MC，但獨占者用 p+p'(y)y=MC，因 p'(y)y<0，其產量低於效率水準。"}, {"q": "獨占的加成訂價公式與營運區段為何？", "a": "p=MC/[1-1/|ε|]；獨占者只在需求彈性 |ε|>1 的區段生產。"}, {"q": "為何說獨占者沒有供給曲線？", "a": "因獨占者對給定的需求會選擇單一最適產量，故談其供給曲線沒有意義。"}], "quiz": [{"q": "獨占者利潤極大化的一階條件為何？", "options": ["p=MC", "MR=MC，即 p(y)+p'(y)y=MC(y)", "p=AC", "MR=AR"], "answer": "MR=MC，即 p(y)+p'(y)y=MC(y)", "explain": "獨占者令邊際收益等於邊際成本；MR=p+p'(y)y，與效率條件 p=MC 不同。"}, {"q": "獨占者的邊際收益與價格關係為何？", "options": ["MR>p", "MR=p", "MR<p=AR", "MR 與 p 無關"], "answer": "MR<p=AR", "explain": "因需求向下傾斜（p'<0），MR=p+p'(y)y<p；而平均收益 AR=p。"}, {"q": "獨占者只會在需求彈性的哪個區段營運？", "options": ["|ε|<1", "|ε|=1", "|ε|>1", "ε=0"], "answer": "|ε|>1", "explain": "由 MR=p[1-1/|ε|]，只有 |ε|>1 時 MR 為正，獨占者才會生產。"}, {"q": "在線性需求且固定 MC 下，對獨占者課徵單位稅 t，價格大約上升多少？", "options": ["上升 t", "上升 t/2", "上升 2t", "完全不變"], "answer": "上升 t/2", "explain": "MR 斜率是需求的兩倍，MC 上移 t 後，均衡價格僅上升 t/2（但固定彈性需求下可轉嫁超過 t）。"}]}, {"num": 26, "title_en": "Price Discrimination (Monopoly Behavior)", "title_zh": "價格歧視（獨占者行為）", "summary": "本章探討獨占者如何透過價格歧視榨取消費者剩餘。第一級價格歧視（完全價格歧視）針對每一單位以消費者最高願付價格出售，或以「要不要隨你」（take it or leave it）方式賣固定數量，使消費者剩餘完全歸獨占者，此時獨占者比較邊際願付與邊際成本，社會剩餘達到最大。第二級（數量／自我選擇）中，低端消費者的方案會被扭曲，以避免高端消費者選擇低端方案。第三級是最常見的價格歧視，依群體區隔訂價（如學生、老人折扣、觀光客較高價），在無轉售下利潤極大化條件為 MR1=MC=MR2，需求彈性絕對值較低的市場價格較高。兩段式定價（如遊樂園）則將每次搭乘收費訂為邊際成本，再以入場費榨取全部消費者剩餘。", "key_terms": [{"term_en": "First-degree price discrimination", "term_zh": "第一級價格歧視（完全價格歧視）", "def": "獨占者對每一單位以消費者所能負擔的最高價格出售，或以「要不要隨你」方式賣一固定數量，使消費者無剩餘，全部社會剩餘歸獨占者，此時結果具效率（社會剩餘極大）。"}, {"term_en": "Second-degree price discrimination", "term_zh": "第二級價格歧視", "def": "透過提供不同方案讓消費者自我選擇；低端消費者的方案會被扭曲，以確保高端消費者不會轉而選擇低端方案。"}, {"term_en": "Third-degree price discrimination", "term_zh": "第三級價格歧視", "def": "最常見的價格歧視形式，依可辨識的群體區隔訂不同價格（如學生、老人折扣、觀光客較高價），前提是各群體間無法轉售。"}, {"term_en": "Two-part tariff", "term_zh": "兩段式定價", "def": "由固定的入場費加上每單位使用費構成；最適作法是將每單位費用訂為邊際成本，再以入場費榨取全部消費者剩餘（如遊樂園的入場費加搭乘費）。"}, {"term_en": "Price elasticity of demand", "term_zh": "需求價格彈性", "def": "衡量群體對價格變動的敏感程度；在第三級價格歧視中，彈性絕對值較低（較不敏感）的市場會被訂較高價格。"}], "key_points": ["第一級價格歧視下消費者無任何剩餘，獨占者比較邊際願付價格與邊際成本，故社會剩餘極大化。", "第一級價格歧視可解讀為：對每單位以最高可收取價格出售，或以「take it or leave it」方式賣固定數量。", "第二級中低端消費者方案被刻意扭曲，目的是使高端消費者不會選擇低端方案（自我選擇約束）。", "第三級是最常見的形式，例子有學生折扣、老人折扣、對觀光客收較高價。", "在兩群體且無轉售下，利潤極大化條件為 MR1(y1)=MC(y1+y2)=MR2(y2)。", "由 MR=p[1-1/|ε|] 可推得：當且僅當 |ε1|<|ε2| 時 p1>p2，即彈性絕對值較低的市場價格較高。", "兩段式定價：把搭乘（使用）費訂為邊際成本，再以入場費榨取全部消費者剩餘。"], "flashcards": [{"q": "第一級價格歧視為何能使社會剩餘達到最大？", "a": "因為消費者被留下零剩餘，獨占者在邊際上是比較消費者的邊際願付價格與邊際成本，故產量達到效率水準，社會剩餘極大化。"}, {"q": "第二級價格歧視中，為什麼低端消費者的方案要被扭曲？", "a": "為了讓高端消費者不會選擇低端方案，以維持自我選擇的分離。"}, {"q": "在第三級價格歧視中，哪個市場會被訂較高的價格？", "a": "需求彈性絕對值較低（對價格較不敏感）的市場價格較高，因 p1>p2 若且唯若 |ε1|<|ε2|。"}, {"q": "兩段式定價的最適策略為何？", "a": "將每單位使用費訂為邊際成本，再透過入場費榨取全部的消費者剩餘。"}, {"q": "第三級價格歧視能成立的重要前提是什麼？", "a": "不同群體之間不能轉售（no resale），否則低價群體會把商品賣給高價群體。"}], "quiz": [{"q": "下列何者為第一級（完全）價格歧視的特徵？", "options": ["消費者保有全部消費者剩餘", "消費者剩餘完全歸獨占者，且結果具效率", "所有消費者支付相同價格", "產量低於單一訂價獨占"], "answer": "消費者剩餘完全歸獨占者，且結果具效率", "explain": "第一級價格歧視榨取全部消費者剩餘，且獨占者在邊際上比較願付與MC，故產量達效率、社會剩餘極大。"}, {"q": "第三級價格歧視下，兩市場價格與彈性的關係為何？", "options": ["彈性絕對值較高者價格較高", "彈性絕對值較低者價格較高", "兩市場價格必相等", "價格與彈性無關"], "answer": "彈性絕對值較低者價格較高", "explain": "由 MR=p[1-1/|ε|] 與 MR1=MR2=MC，可得 p1>p2 若且唯若 |ε1|<|ε2|，即較不敏感的市場價格較高。"}, {"q": "遊樂園採兩段式定價時的最適作法是？", "options": ["入場費設為零，每次搭乘收高價", "每次搭乘費訂為邊際成本，入場費榨取消費者剩餘", "入場費與搭乘費都訂在邊際成本", "只收入場費，搭乘免費且不管邊際成本"], "answer": "每次搭乘費訂為邊際成本，入場費榨取消費者剩餘", "explain": "課文指出：設每次搭乘費等於邊際成本，再以入場費榨取全部消費者剩餘。"}]}, {"num": 27, "title_en": "Factor Markets", "title_zh": "要素市場", "summary": "本章分析要素市場中的獨買（monopsony，單一買者）與上下游獨占。廠商在要素市場的最適僱用，涉及邊際收益產量（MRP）：由 max p(y)y-c(y) 導出 MRPx = MR·MPx = p(y)[1-1/|ε|]·MPx。獨買者面對向上傾斜的（反）要素供給 w(x)，其利潤極大化為 max pf(x)-w(x)x，一階條件為邊際產量價值 pf'(x) 等於邊際支出 ME=w(x)+w'(x)x=w(x)[1+1/η(x)]，其中 η(x) 為要素供給彈性。因供給向上傾斜（η>0），邊際支出大於平均支出（ME>AE），因為多僱一單位不只付該單位工資，先前所有單位也要付更高價。若 w(x)=a+bx，則邊際支出曲線 a+2bx 為供給曲線的兩倍陡。此外亦討論上下游獨占：下游獨占者的邊際收益曲線 MRD 成為上游獨占者面對的需求，整合的獨占者產量高於未整合者。", "key_terms": [{"term_en": "Monopsony", "term_zh": "獨買（買方獨占）", "def": "要素市場中只有單一買者的情形；其面對向上傾斜的要素供給曲線，僱用決策需考慮自身行為對要素價格的影響。"}, {"term_en": "Marginal revenue product (MRP)", "term_zh": "邊際收益產量", "def": "多僱用一單位要素所帶來的收益增量，等於邊際收益乘以要素邊際產量 MRPx=MR·MPx=p(y)[1-1/|ε|]·MPx。"}, {"term_en": "Marginal expenditure (ME)", "term_zh": "邊際支出", "def": "獨買者多僱一單位要素所增加的總支出 ME=w(x)[1+1/η(x)]=w(x)+w'(x)x；因供給向上傾斜，多僱一單位使先前各單位成本也上升。"}, {"term_en": "Average expenditure (AE)", "term_zh": "平均支出", "def": "每單位要素的平均支出 AE=w(x)x/x=w(x)，等於要素供給曲線本身；當供給向上傾斜時 ME>AE。"}, {"term_en": "Factor supply elasticity", "term_zh": "要素供給彈性", "def": "以 η(x) 表示，衡量要素供給量對要素價格的反應；η(x)>0 導致 ME>AE。"}, {"term_en": "Upstream and downstream monopoly", "term_zh": "上游與下游獨占", "def": "下游獨占者面對需求 p(y)，其邊際收益曲線 MRD(y) 成為上游獨占者面對的需求曲線；整合的獨占者產量高於未整合者。"}], "key_points": ["邊際收益產量 MRPx = MR·MPx = p(y)[1-1/|ε|]·MPx，是僱用要素的收益面。", "獨買者利潤極大化 max pf(x)-w(x)x，一階條件為邊際產量價值 pf'(x) 等於邊際支出 w(x)+w'(x)x。", "多僱一單位要素成本 w(x)，但因供給向上傾斜，先前僱用的各單位也變貴，故需加上 w'(x)x。", "邊際支出 ME=w(x)[1+1/η(x)]，平均支出 AE=w(x)，因 η(x)>0 故 ME>AE。", "若 w(x)=a+bx，邊際支出曲線為 a+2bx，斜率是供給曲線的兩倍陡。", "上下游獨占中，下游的邊際收益曲線 MRD 即為上游面對的需求曲線；整合獨占的產量高於未整合。"], "flashcards": [{"q": "什麼是獨買（monopsony）？", "a": "要素市場中只有單一買者的情形；買者面對向上傾斜的要素供給曲線，其僱用會影響要素價格。"}, {"q": "獨買者的邊際支出為何大於平均支出（ME>AE）？", "a": "因為要素供給向上傾斜（η>0），多僱一單位不僅付該單位工資，先前所有僱用單位也必須付更高價格，故 ME=w(x)[1+1/η]>w(x)=AE。"}, {"q": "若要素供給為 w(x)=a+bx，邊際支出曲線為何？", "a": "邊際支出為 a+2bx，斜率是供給曲線的兩倍陡。"}, {"q": "邊際收益產量 MRP 的公式為何？", "a": "MRPx = MR·MPx = p(y)[1-1/|ε|]·MPx，即邊際收益乘以要素的邊際產量。"}, {"q": "上下游獨占中，上游獨占者面對的需求曲線是什麼？", "a": "下游獨占者的邊際收益曲線 MRD(y) 成為上游獨占者所面對的需求曲線；整合的獨占者產量高於未整合者。"}], "quiz": [{"q": "獨買者（monopsony）的最適僱用一階條件為何？", "options": ["邊際產量價值等於平均支出 AE", "邊際產量價值等於邊際支出 ME=w(x)+w'(x)x", "工資等於邊際產量", "邊際收益等於邊際成本"], "answer": "邊際產量價值等於邊際支出 ME=w(x)+w'(x)x", "explain": "由 max pf(x)-w(x)x 的FOC得 pf'(x)=w(x)+w'(x)x，左邊為邊際產量價值、右邊為邊際支出。"}, {"q": "當要素供給向上傾斜時，邊際支出與平均支出的關係為？", "options": ["ME<AE", "ME=AE", "ME>AE", "無法比較"], "answer": "ME>AE", "explain": "因供給彈性 η(x)>0，ME=w(x)[1+1/η(x)]>w(x)=AE；多僱一單位使先前各單位成本也提高。"}, {"q": "關於上下游獨占，下列敘述何者正確？", "options": ["下游需求曲線即上游面對的需求", "下游的邊際收益曲線 MRD 成為上游面對的需求曲線，整合獨占產量較高", "未整合獨占產量高於整合獨占", "上游與下游產量必然相同"], "answer": "下游的邊際收益曲線 MRD 成為上游面對的需求曲線，整合獨占產量較高", "explain": "課文指出下游邊際收益 MRD(y) 是上游面對的需求，整合的獨占者產量 yi 高於未整合者。"}]}, {"num": 28, "title_en": "Oligopoly", "title_zh": "寡占", "summary": "本章介紹寡占的主要模型。Stackelberg（史塔貝格）領導者模型適用於有主導廠商或自然領導者的產業，追隨者觀察領導者的宣布後再調整；求解須以逆向歸納，先解追隨者的反應函數 y2=f(y1)，領導者再將其代入自身極大化。以線性需求 p(Y)=a-bY、成本為零為例，追隨者反應函數為 y2=(a-by1)/2b，領導者選 y1=a/2b、追隨者 y2=a/4b。Cournot（古諾）模型中兩廠商同時決定產量，各自須預測對方產量，均衡為預測獲得證實之狀態，即兩條反應曲線的交點，各自產量互為最適反應。卡特爾（cartel）合謀極大化聯合利潤，但個別成員有偷跑（cheating）誘因，重複賽局與懲罰策略（偷跑後永遠轉為Cournot競爭）可在利率 r 夠低（未來夠重要）時維持合謀。Bertrand（伯特蘭）價格競爭下，透過削價論證可推得均衡為 p=MC。", "key_terms": [{"term_en": "Stackelberg model", "term_zh": "史塔貝格（領導者）模型", "def": "存在領導者與追隨者的數量競爭模型；領導者先行決定產量並考慮追隨者的反應，以逆向歸納求解（如Apple與其追隨者）。"}, {"term_en": "Reaction function", "term_zh": "反應函數", "def": "給定對手產量下，一廠商的最適產量；線性需求下追隨者的反應函數為 y2=(a-by1)/2b。"}, {"term_en": "Cournot model", "term_zh": "古諾模型", "def": "兩廠商同時決定產量，各自預測對方產量；均衡是預測獲證實、各自產量互為最適反應之狀態，即兩反應曲線的交點。"}, {"term_en": "Isoprofit line", "term_zh": "等利潤線", "def": "使某廠商利潤維持定值的產量組合；廠商追求與反應曲線相切的等利潤線以取得最高利潤。"}, {"term_en": "Cartel", "term_zh": "卡特爾（合謀）", "def": "廠商合謀以極大化聯合利潤；但個別成員有偷跑誘因，維持合謀是一大難題。"}, {"term_en": "Bertrand competition", "term_zh": "伯特蘭（價格）競爭", "def": "廠商以價格競爭；透過削價論證，唯一均衡為 pi=pj=c，即價格等於邊際成本。"}], "key_points": ["Stackelberg以逆向歸納求解：先解追隨者反應函數 y2=f(y1)，領導者再代入自身極大化。", "線性需求、零成本下，Stackelberg結果為領導者 y1=a/2b、追隨者 y2=a/4b。", "Cournot下兩廠商同時決定產量，均衡是各自互為最適反應、兩反應曲線的交點（預測獲證實）。", "卡特爾合謀時，個別成員增加產量可使利潤上升 -(dP/dY)y2>0，故有強烈偷跑誘因。", "重複賽局的懲罰策略：一旦偷跑就永遠轉為Cournot競爭，若 r 夠小（未來夠重要）則不會偏離合謀。", "維持合謀的條件為 r<(πm-πc)/... 型式，即利率夠低、未來足夠重要。", "Bertrand價格競爭經削價論證，均衡為 pi=pj=c（價格等於邊際成本）。"], "flashcards": [{"q": "為什麼Stackelberg模型要用逆向歸納求解？", "a": "因為領導者須預期追隨者會在給定領導者選擇下極大化利潤，故先解出追隨者的反應函數 y2=f(y1)，再代入領導者的極大化問題。"}, {"q": "在線性需求 p=a-bY、零成本的Stackelberg模型中，領導者與追隨者的均衡產量各為何？", "a": "領導者 y1=a/2b，追隨者 y2=a/4b。"}, {"q": "Cournot均衡在圖形上位於何處？", "a": "位於兩條反應曲線的交點，此時雙方產量互為最適反應，且各自對對方產量的預測獲得證實。"}, {"q": "為何卡特爾難以維持？", "a": "因為個別成員有偷跑誘因——在對方維持產量下增加自身產量能使利潤上升 -(dP/dY)y2>0，故阻止成員偷跑是一大難題。"}, {"q": "重複賽局中懲罰策略如何維持合謀？", "a": "採用「一旦有人偷跑就永遠轉為Cournot競爭」的懲罰；只要利率 r 夠低、未來夠重要，偷跑一次的短期利益不及長期合謀利益，廠商就不會偏離。"}], "quiz": [{"q": "Stackelberg模型的正確求解方式為何？", "options": ["兩廠商同時求解", "以逆向歸納，先解追隨者反應函數再代入領導者問題", "先解領導者，追隨者不做反應", "以價格競爭削價求解"], "answer": "以逆向歸納，先解追隨者反應函數再代入領導者問題", "explain": "領導者須考量追隨者會在給定其選擇下極大化利潤，故先得追隨者反應函數 y2=f(y1) 再代入領導者極大化。"}, {"q": "Cournot均衡的定義為何？", "options": ["價格等於邊際成本", "各廠商產量互為最適反應、兩反應曲線的交點", "領導者先動、追隨者後動", "所有廠商聯合極大化利潤"], "answer": "各廠商產量互為最適反應、兩反應曲線的交點", "explain": "Cournot為同時決定產量，均衡是各自對對方為最適反應且預測獲證實，圖形上為兩反應曲線交點。"}, {"q": "Bertrand價格競爭（同質商品、常數邊際成本 c）的均衡價格為何？", "options": ["p=獨占價格", "p>c 的某一水準", "p=c（邊際成本）", "p<c"], "answer": "p=c（邊際成本）", "explain": "課文透過削價論證：任何 p>c 都會被對手稍微削價搶走市場，唯一均衡是 pi=pj=c。"}]}, {"num": 29, "title_en": "Game Theory", "title_zh": "賽局理論", "summary": "本章介紹賽局理論的基本概念。以標準式賽局（normal form game）與囚犯困境（Prisoner's dilemma）為例：合作與背叛的抉擇。並非每個賽局都有嚴格優勢策略（strictly dominant strategy），但可能有嚴格劣勢策略（strictly dominated strategy），故至少可斷言玩家不會採用嚴格劣勢策略，並以「反覆刪去嚴格劣勢策略」（iterated elimination of strictly dominated strategies）來求解。Nash 均衡（Nash equilibrium）含兩要素：最適反應（best responding）與正確信念（correct beliefs，玩家對對手行為的信念與對手實際選擇一致）。然而Nash均衡有時不令人滿意，例如「空洞威脅」（empty threats）問題：以老師威脅學生退選為例，若學生因悲觀信念而退選，威脅便從未被檢驗。為排除此類不合理的Nash均衡，對於序列（動態）賽局採逆向歸納求解子賽局完全均衡（SPNE）。", "key_terms": [{"term_en": "Prisoner's dilemma", "term_zh": "囚犯困境", "def": "標準式賽局的經典例子；雙方各在合作與背叛間抉擇，個別理性導致背叛，結果劣於共同合作。"}, {"term_en": "Strictly dominant / dominated strategy", "term_zh": "嚴格優勢／嚴格劣勢策略", "def": "嚴格優勢策略在對手任何選擇下皆最佳；並非總是存在。嚴格劣勢策略則在任何情況下皆較差，故理性玩家不會採用。"}, {"term_en": "Iterated elimination of strictly dominated strategies", "term_zh": "反覆刪去嚴格劣勢策略", "def": "一種求解方法：反覆地將各玩家的嚴格劣勢策略刪去，以縮小可能結果。"}, {"term_en": "Nash equilibrium", "term_zh": "納許均衡", "def": "每位玩家都在對手選擇下做最適反應，且對對手行為的信念正確（與對手實際選擇一致）；含最適反應與正確信念兩要素。"}, {"term_en": "Empty threats", "term_zh": "空洞威脅", "def": "Nash均衡的一個問題：威脅在均衡路徑上從未被執行或檢驗（如老師威脅退選），使某些不合理的均衡得以存在，故需以SPNE排除。"}, {"term_en": "Subgame perfect Nash equilibrium (SPNE)", "term_zh": "子賽局完全納許均衡", "def": "對於序列（動態）賽局以逆向歸納求解的均衡概念，能排除依賴空洞威脅的不合理Nash均衡。"}], "key_points": ["囚犯困境是標準式賽局的經典例子，涉及合作與背叛的抉擇。", "並非總有嚴格優勢策略，但若有嚴格劣勢策略，可斷言玩家不會採用它。", "可用『反覆刪去嚴格劣勢策略』來求解賽局。", "Nash均衡有兩要素：最適反應與正確信念（信念與對手實際行為一致）。", "Nash均衡不一定令人滿意，有時協調賽局可協調出比Nash更好的結果，且存在空洞威脅問題。", "空洞威脅指均衡路徑上威脅從未被檢驗（如威脅學生退選），此類不合理均衡應被排除。", "對序列賽局採逆向歸納求解SPNE，以排除依賴空洞威脅的Nash均衡。"], "flashcards": [{"q": "Nash均衡包含哪兩個重要要素？", "a": "最適反應（best responding）與正確信念（correct beliefs）——即玩家對對手行為的信念與對手實際選擇一致。"}, {"q": "當賽局沒有嚴格優勢策略時，我們至少能作什麼推論？", "a": "若存在嚴格劣勢策略，至少可斷言理性玩家不會採用嚴格劣勢策略，並可用反覆刪去嚴格劣勢策略來求解。"}, {"q": "什麼是空洞威脅（empty threats）？", "a": "指Nash均衡中，威脅在均衡路徑上從未被執行或檢驗（如老師威脅退選、學生退選後威脅不必兌現），使不合理的均衡得以存在。"}, {"q": "如何排除依賴空洞威脅的Nash均衡？", "a": "對序列（動態）賽局採逆向歸納，求解子賽局完全納許均衡（SPNE）。"}, {"q": "囚犯困境屬於哪一類賽局，其抉擇為何？", "a": "屬標準式（normal form）賽局；每位玩家在合作（Coop）與背叛（Defect）之間抉擇。"}], "quiz": [{"q": "Nash均衡的兩個核心要素是什麼？", "options": ["嚴格優勢與嚴格劣勢", "最適反應與正確信念", "合作與背叛", "領導與追隨"], "answer": "最適反應與正確信念", "explain": "課文指出Nash均衡有兩要素：每位玩家對對手做最適反應，且其信念與對手實際選擇一致（正確信念）。"}, {"q": "『反覆刪去嚴格劣勢策略』的依據為何？", "options": ["玩家一定會採用優勢策略", "理性玩家不會採用嚴格劣勢策略", "所有策略都同等可能", "玩家會隨機選擇"], "answer": "理性玩家不會採用嚴格劣勢策略", "explain": "即使沒有嚴格優勢策略，只要有嚴格劣勢策略就可斷言不會被採用，據此反覆刪去以求解。"}, {"q": "為排除含空洞威脅的不合理Nash均衡，動態賽局採用何種解法？", "options": ["同時求解所有策略", "反覆刪去優勢策略", "逆向歸納求解SPNE", "隨機化策略"], "answer": "逆向歸納求解SPNE", "explain": "課文以老師威脅退選為例說明空洞威脅，並指出對序列賽局以逆向歸納求解子賽局完全均衡（SPNE）來排除此類均衡。"}]}, {"num": 31, "title_en": "Behavioral Economics", "title_zh": "行為經濟學", "summary": "行為經濟學運用心理學的洞見，研究消費者實際如何做選擇，而這些選擇可能與傳統『理性』模型不一致。經濟學家的第一反應是設法將其合理化（rationalize）。課文以錨定效應（anchoring effect）為例：先請人以學號末兩位數乘以10作為對巧克力的願付價，結果顯示人們的選擇會被此無關數字所錨定。在跨期選擇上，指數折現（exponential discounting）u(c1)+δu(c2)+δ²u(c3) 具有時間一致性——第2、3期間的MRS無論在第1期或第2期評估皆為 δu'(c2)/... 相同；但（雙曲）折現會使兩者不同，導致時間不一致（time inconsistency）。此外引用 Fehr 等人的神經經濟學研究：以低頻重複經顱磁刺激干擾右側（而非左側）背外側前額葉皮質（DLPFC），會顯著降低受試者拒絕對方蓄意不公平提議的意願，顯示受試者較無法抵抗接受這些提議的經濟誘惑。", "key_terms": [{"term_en": "Behavioral economics", "term_zh": "行為經濟學", "def": "運用心理學洞見研究消費者實際如何做選擇的領域；這些選擇可能與傳統『理性』模型不符。"}, {"term_en": "Anchoring effect", "term_zh": "錨定效應", "def": "人們的選擇會被一個（甚至不相關的）參考數字所錨定，例如以學號末兩位數影響對巧克力的願付價。"}, {"term_en": "Exponential discounting", "term_zh": "指數折現", "def": "效用形式 u(c1)+δu(c2)+δ²u(c3)…；具時間一致性，因兩期間的MRS無論在何時評估皆相同。"}, {"term_en": "Time inconsistency", "term_zh": "時間不一致", "def": "同一跨期抉擇在不同時點評估得到不同的偏好；（雙曲型）折現會導致此現象，與指數折現的時間一致性相反。"}, {"term_en": "Dorsolateral prefrontal cortex (DLPFC)", "term_zh": "背外側前額葉皮質", "def": "Fehr等人研究中，以低頻重複經顱磁刺激干擾右側（非左側）DLPFC，會降低受試者拒絕不公平提議的意願。"}], "key_points": ["行為經濟學以心理學洞見研究實際選擇，這些選擇可能與傳統理性模型不一致。", "面對異常行為，經濟學家的第一反應是嘗試將其合理化（rationalize）。", "錨定效應：以學號末兩位乘10當作願付價的實驗顯示，選擇會被無關數字錨定。", "指數折現 u(c1)+δu(c2)+δ²u(c3) 具時間一致性：跨期MRS不隨評估時點改變。", "（雙曲）折現使不同時點評估的MRS不同，導致時間不一致。", "Fehr等人的神經經濟學研究：干擾右側DLPFC降低拒絕不公平提議的意願，顯示較難抵抗接受提議的經濟誘惑。"], "flashcards": [{"q": "什麼是錨定效應（anchoring effect）？", "a": "人們的選擇會被一個參考數字所錨定，即使該數字與真實價值無關（如以學號末兩位乘10影響對巧克力的願付價）。"}, {"q": "為什麼指數折現具有時間一致性？", "a": "因為第2、3期之間的MRS，無論在第1期或第2期評估都相同（皆為 δu'(c2) 型式），偏好不隨評估時點改變，故時間一致。"}, {"q": "時間不一致（time inconsistency）如何產生？", "a": "當採用（雙曲型）折現時，同一跨期抉擇在不同時點評估得到不同的MRS，使偏好前後不一致。"}, {"q": "行為經濟學研究對象與傳統模型有何差異？", "a": "行為經濟學運用心理學洞見研究消費者『實際』如何選擇，這些選擇可能與傳統的『理性』模型相互矛盾。"}, {"q": "Fehr等人干擾右側DLPFC的實驗結果為何？", "a": "以低頻重複經顱磁刺激干擾右側（非左側）DLPFC，會顯著降低受試者拒絕對方蓄意不公平提議的意願，顯示較無法抵抗接受提議的經濟誘惑。"}], "quiz": [{"q": "以學號末兩位數影響對巧克力願付價的實驗，說明了什麼現象？", "options": ["指數折現", "錨定效應", "時間不一致", "嚴格優勢策略"], "answer": "錨定效應", "explain": "此實驗顯示選擇會被一個無關的參考數字（學號末兩位）所錨定，即錨定效應。"}, {"q": "關於指數折現與時間一致性，下列何者正確？", "options": ["指數折現導致時間不一致", "指數折現具時間一致性，跨期MRS不隨評估時點改變", "指數折現與雙曲折現結果相同", "指數折現不涉及跨期選擇"], "answer": "指數折現具時間一致性，跨期MRS不隨評估時點改變", "explain": "課文指出指數折現下第2、3期間的MRS在第1期與第2期評估皆相同，故時間一致；雙曲折現才導致時間不一致。"}, {"q": "Fehr等人的神經經濟學研究發現，干擾右側DLPFC會如何影響行為？", "options": ["提高拒絕不公平提議的意願", "降低拒絕不公平提議的意願，較難抵抗接受的誘惑", "對行為毫無影響", "使受試者變得更理性"], "answer": "降低拒絕不公平提議的意願，較難抵抗接受的誘惑", "explain": "研究顯示干擾右側（非左側）DLPFC會顯著降低受試者拒絕蓄意不公平提議的意願，顯示他們較無法抵抗接受提議的經濟誘惑。"}]}, {"num": 32, "title_en": "Exchange", "title_zh": "交換", "summary": "本章以純交換經濟（pure exchange economy）與 Edgeworth box 分析資源配置的效率。核心是 Pareto 最優：若沒有其他可行配置能在不使任何人變差的情況下讓某些人變好，則此配置為 Pareto 最優。競爭均衡由相對價格決定（只有相對價格重要），並滿足各財貨供需相等。Walras 法則指出所有市場超額需求的價值加總為零。福利經濟學第一定理指出競爭均衡必為 Pareto 最優；本章並以反證法說明此結論。最後比較兩種獨占情形：獨占者在對方 offer curve 上選點通常無效率，在通過稟賦的對方無異曲線上選點則有效率。", "key_terms": [{"term_en": "Pareto Optimal", "term_zh": "柏拉圖最優", "def": "一個可行配置 x=(xA,xB) 是 Pareto 最優，若不存在其他可行配置能 Pareto 支配它（即無法在不使任何人變差下讓某人變好）。"}, {"term_en": "Pareto Dominate", "term_zh": "柏拉圖支配", "def": "另一可行配置 x' 至少讓一人嚴格偏好、且沒有人變得更差，則稱 x' 支配原配置。"}, {"term_en": "Walras' Law", "term_zh": "瓦拉斯法則", "def": "所有市場超額需求以價格加權後的總價值恆等於零；本章以 Cobb-Douglas 例子驗證此性質。"}, {"term_en": "Relative Prices", "term_zh": "相對價格", "def": "均衡只取決於相對價格；若 (p1,p2) 是均衡價格，則 (2p1,2p2) 亦然。"}, {"term_en": "Excess Demand", "term_zh": "超額需求", "def": "某財貨的總需求量減去總稟賦量；均衡時各財貨超額需求為零。"}, {"term_en": "Offer Curve", "term_zh": "提供曲線", "def": "在不同相對價格下消費者願意進行交易後選擇的最適配置所形成的軌跡。"}], "key_points": ["Pareto 最優的定義是「不存在能 Pareto 支配它的其他可行配置」。", "競爭均衡要求各財貨的個別需求加總等於總稟賦（市場結清）。", "只有相對價格重要，價格同比例放大不改變均衡，此與 Walras 法則相關。", "以 Cobb-Douglas 效用（A、B 兩人）可寫出各財貨超額需求並驗證 Walras 法則。", "福利經濟學第一定理：競爭均衡必為 Pareto 最優；可用反證法證明——若存在支配配置則會違反可行性。", "獨占者在對方 offer curve 上選點通常無效率；在通過稟賦的對方無異曲線上選點則有效率。", "兩種獨占情形有不同的分配後果，但後者在效率上仍為滿意（efficient）。"], "flashcards": [{"q": "Pareto 最優（Pareto optimal）如何定義？", "a": "若不存在其他可行配置能 Pareto 支配該配置（即無法在不損及任何人下讓某人更好），則此配置為 Pareto 最優。"}, {"q": "Walras 法則（Walras' law）在說什麼？", "a": "所有市場超額需求以價格加權的總價值恆為零。"}, {"q": "為何說「只有相對價格重要」？", "a": "若 (p1,p2) 為好的（均衡）價格，則 (2p1,2p2) 亦然；等比例放大價格不改變均衡配置。"}, {"q": "福利經濟學第一定理在交換經濟中的內容為何？", "a": "任何競爭均衡都是 Pareto 最優的。"}, {"q": "兩種交換獨占情形中，何者有效率、何者無效率？", "a": "獨占者在對方 offer curve 上選點通常無效率；在通過稟賦的對方無異曲線上選點則有效率。"}], "quiz": [{"q": "下列何者為 Pareto 最優的正確定義？", "options": ["所有人效用相等的配置", "不存在其他可行配置能 Pareto 支配它的配置", "使社會總效用最大的配置", "使最貧者效用最大的配置"], "answer": "不存在其他可行配置能 Pareto 支配它的配置", "explain": "課文定義：可行配置若無其他可行配置能 Pareto 支配它（無法在不損及他人下改善某人），即為 Pareto 最優。"}, {"q": "關於交換經濟中的價格，下列敘述何者正確？", "options": ["只有絕對價格重要", "只有相對價格重要，等比例放大不影響均衡", "價格加倍會使均衡消失", "價格與均衡無關"], "answer": "只有相對價格重要，等比例放大不影響均衡", "explain": "課文指出若 (p1,p2) 是好的價格，(2p1,2p2) 也是，此與 Walras 法則相關。"}, {"q": "Walras 法則描述的是什麼？", "options": ["所有市場超額需求的加權總價值為零", "所有財貨價格必相等", "獨占者利潤最大化條件", "個人稟賦必等於他人稟賦"], "answer": "所有市場超額需求的加權總價值為零", "explain": "課文以 Cobb-Douglas 例子驗證各財貨超額需求以價格加權後加總為零。"}, {"q": "在兩種交換獨占情形的比較中，效率結論為何？", "options": ["兩者皆有效率", "兩者皆無效率", "在對方 offer curve 上選點通常無效率，在對方通過稟賦的無異曲線上選點則有效率", "在 offer curve 上選點有效率，另一種無效率"], "answer": "在對方 offer curve 上選點通常無效率，在對方通過稟賦的無異曲線上選點則有效率", "explain": "課文明言前者一般無效率、後者有效率，兩者分配後果不同。"}]}, {"num": 33, "title_en": "Production", "title_zh": "生產", "summary": "本章將 Edgeworth box 的分析延伸至生產面：以稟賦勞動與資本為方框的寬與長，探討兩廠商間投入使用的效率。投入使用效率要求兩廠商的邊際技術替代率（MRTS）相等；若不相等，重新配置勞動與資本可同時增加兩財貨產量。由此引出邊際轉換率（MRT），它等於兩財貨邊際產量之比。本章亦提及 Walras 法則：將各廠商利潤與消費者預算加總後，超額需求（含財貨與要素市場）之總價值為零。", "key_terms": [{"term_en": "Marginal Rate of Technical Substitution (MRTS)", "term_zh": "邊際技術替代率", "def": "在維持產量不變下，一種投入（如勞動 L）可替代另一投入（如資本 K）的比率；生產效率要求兩廠商 MRTS 相等。"}, {"term_en": "Marginal Rate of Transformation (MRT)", "term_zh": "邊際轉換率", "def": "生產可能邊界上一財貨可轉換為另一財貨的比率；課文得出 MRT_{F,C}=MPL_C/MPL_F。"}, {"term_en": "Marginal Product of Labor (MPL)", "term_zh": "勞動邊際產量", "def": "多投入一單位勞動所增加的產量；移動一單位 L 由 C 到 F，F 增加 MPL_F、C 減少 MPL_C。"}, {"term_en": "Edgeworth Box (Production)", "term_zh": "生產的艾吉沃斯方框", "def": "以稟賦勞動與稟賦資本為方框的寬與長，用以分析兩廠商間投入的配置效率。"}, {"term_en": "Walras' Law (Product
