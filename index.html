ion)", "term_zh": "瓦拉斯法則（生產）", "def": "將廠商利潤與消費者預算式加總後，財貨與要素市場的超額需求以價格加權之總值恆為零。"}], "key_points": ["投入使用效率要求兩廠商的 MRTS 相等。", "若 MRTS_{L,K}^F=2 > MRTS_{L,K}^C=0.5，應將一單位 L 由 C 移到 F、一單位 K 由 F 移到 C，兩者產量皆可增加。", "邊際轉換率（MRT）由要素重配置導出：移一單位 L 由 C 到 F，使 F 增 MPL_F、C 減 MPL_C。", "故 MRT_{F,C}=MPL_C/MPL_F。", "廠商利潤 π_F=p_F·F−wL_F−rK_F，π_C=p_C·C−wL_C−rK_C。", "將各廠商利潤與消費者預算加總，可得財貨與要素市場超額需求的總值為零（Walras 法則）。"], "flashcards": [{"q": "生產中投入使用效率的條件為何？", "a": "兩廠商的邊際技術替代率（MRTS）必須相等。"}, {"q": "若 MRTS^F=2 > MRTS^C=0.5，應如何重配置要素？", "a": "將一單位勞動由 C 移到 F，一單位資本由 F 移到 C，如此 C、F 產量皆可增加。"}, {"q": "邊際轉換率（MRT）與邊際產量的關係為何？", "a": "MRT_{F,C}=MPL_C/MPL_F；由移動一單位勞動導致 F 增 MPL_F、C 減 MPL_C 推得。"}, {"q": "生產 Edgeworth box 的方框寬與長代表什麼？", "a": "分別代表稟賦的勞動與稟賦的資本。"}, {"q": "廠商 F 的利潤如何表示？", "a": "π_F = p_F·F − wL_F − rK_F。"}], "quiz": [{"q": "兩廠商間投入使用達到效率的條件是什麼？", "options": ["兩廠商利潤相等", "兩廠商的 MRTS 相等", "兩廠商使用相同數量的勞動", "兩財貨價格相等"], "answer": "兩廠商的 MRTS 相等", "explain": "課文指出效率要求兩廠商在 Edgeworth box 中的邊際技術替代率相等。"}, {"q": "當 MRTS^F=2 大於 MRTS^C=0.5 時，正確的重配置為何？", "options": ["一單位 L 由 F 移到 C，一單位 K 由 C 移到 F", "一單位 L 由 C 移到 F，一單位 K 由 F 移到 C", "兩廠商都增加 L 與 K", "維持不變即為最適"], "answer": "一單位 L 由 C 移到 F，一單位 K 由 F 移到 C", "explain": "課文說明如此調整能同時增加 C 與 F 的產量。"}, {"q": "邊際轉換率 MRT_{F,C} 等於下列何者？", "options": ["MPL_F/MPL_C", "MPL_C/MPL_F", "MPL_F×MPL_C", "w/r"], "answer": "MPL_C/MPL_F", "explain": "移一單位勞動由 C 到 F，F 增 MPL_F、C 減 MPL_C，故 MRT_{F,C}=MPL_C/MPL_F。"}, {"q": "生產的 Edgeworth box 的方框尺寸由什麼決定？", "options": ["兩財貨的價格", "稟賦的勞動與稟賦的資本", "兩廠商的利潤", "消費者的效用"], "answer": "稟賦的勞動與稟賦的資本", "explain": "課文開宗明義以稟賦勞動與稟賦資本作為方框的寬與長。"}]}, {"num": 34, "title_en": "Welfare", "title_zh": "福利", "summary": "本章探討如何加總不同消費者的偏好以形成社會偏好。多數決可能產生循環（不同投票順序導致不同贏家），rank-order voting 則可能因引入無關選項而改變結果。Arrow 不可能定理指出：若社會決策機制同時滿足某些合理性質，則必為獨裁。既然如此，只能放棄某些理想特性，或改用個人效用的基數並加總，即社會福利函數 W(u1,...,un)。常見有古典功利主義（加總各人效用）與 Rawls 型（取最小效用）。福利極大的配置必為 Pareto 效率；若個人偏好只取決於自身財貨束，則福利極大等於 Pareto 效率並可由市場均衡達成。最後定義公平配置：兼具無妒忌（equitable）與 Pareto 效率者為 fair allocation。", "key_terms": [{"term_en": "Arrow's Impossibility Theorem", "term_zh": "亞羅不可能定理", "def": "若社會決策機制同時滿足所列的三項合理性質，則它必為獨裁——所有社會排序即某一個人的排序。"}, {"term_en": "Social Welfare Function", "term_zh": "社會福利函數", "def": "個人效用函數的某種函數 W(u1,...,un)，僅依個人效用來排序不同配置。"}, {"term_en": "Utilitarian Welfare Function", "term_zh": "功利主義福利函數", "def": "古典功利主義形式 W=Σui，即把各人效用相加；x 社會偏好於 y 若 Σui(x)>Σui(y)。"}, {"term_en": "Rawlsian Welfare Function", "term_zh": "羅爾斯福利函數", "def": "W(u1,...,un)=min{u1,...,un}，社會福利取決於境況最差者的效用。"}, {"term_en": "Equitable Allocation", "term_zh": "公正（無妒忌）配置", "def": "沒有任何人偏好他人的財貨束勝過自己的；若某人偏好他人的束，則稱其妒忌（envies）對方。"}, {"term_en": "Fair Allocation", "term_zh": "公平配置", "def": "同時是公正（equitable）且 Pareto 效率的配置。"}], "key_points": ["多數決可能產生循環，投票順序不同會導致不同的贏家。", "rank-order voting 可能因引入無關第三選項而改變原本 x、y 的結果。", "Arrow 不可能定理：滿足三項合理性質的社會決策機制必為獨裁。", "面對此負面結果，只能放棄某項理想特性，或改用個人效用的基數加以加總，形成社會福利函數。", "經濟學家通常只主張社會福利函數應對每位消費者的效用遞增，其餘為倫理判斷。", "福利極大的配置必為 Pareto 效率；若個人偏好僅取決於自身財貨束，則福利極大＝Pareto 效率＝市場均衡。", "同時為公正（無妒忌）且 Pareto 效率的配置稱為公平配置；可用兩人交換財貨束來檢驗是否公正。"], "flashcards": [{"q": "Arrow 不可能定理的結論是什麼？", "a": "若社會決策機制同時滿足所列三項合理性質，則它必然是獨裁——社會排序即某一個人的排序。"}, {"q": "功利主義與 Rawls 型社會福利函數的形式各為何？", "a": "功利主義 W=Σui（加總各人效用）；Rawls 型 W=min{u1,...,un}（取最小效用）。"}, {"q": "經濟學家對社會福利函數唯一的普遍要求是什麼？", "a": "社會福利函數應對每位消費者的效用遞增；其餘涉及倫理判斷，經濟學家通常不置喙。"}, {"q": "福利極大配置與 Pareto 效率的關係為何？", "a": "福利極大的配置必為 Pareto 效率；若偏好只取決於自身財貨束，福利極大＝Pareto 效率＝市場均衡。"}, {"q": "什麼是公平（fair）配置？", "a": "同時滿足公正（無妒忌，equitable）與 Pareto 效率的配置。"}], "quiz": [{"q": "Arrow 不可能定理指出，滿足所列合理性質的社會決策機制必然是？", "options": ["多數決", "獨裁", "功利主義", "市場均衡"], "answer": "獨裁", "explain": "課文明言：若同時滿足三項性質，社會排序必為某一個人的排序，即獨裁。"}, {"q": "下列何者為 Rawls 型社會福利函數？", "options": ["W=Σui", "W=Πui", "W=min{u1,...,un}", "W=max{u1,...,un}"], "answer": "W=min{u1,...,un}", "explain": "Rawls 型福利函數取所有人效用的最小值。"}, {"q": "關於福利極大配置與效率，下列敘述何者正確？", "options": ["福利極大配置可能無效率", "福利極大配置必為 Pareto 效率", "Pareto 效率必為福利極大", "兩者無關"], "answer": "福利極大配置必為 Pareto 效率", "explain": "因社會福利函數對各人效用遞增，若可 Pareto 改善則福利更高，與原為福利極大矛盾。"}, {"q": "一配置若「沒有任何人偏好他人的財貨束勝過自己」，稱為？", "options": ["公平（fair）", "公正／無妒忌（equitable）", "Pareto 效率", "獨裁"], "answer": "公正／無妒忌（equitable）", "explain": "課文定義無妒忌即公正；若還兼具 Pareto 效率才稱為公平（fair）。"}]}, {"num": 35, "title_en": "Externalities", "title_zh": "外部性", "summary": "本章討論外部性：一方行為直接影響他方效用或生產，而未透過市場價格反映。正外部性（如欣賞鄰居花園）與負外部性（如深夜噪音）皆屬消費外部性。在生產外部性中，市場均衡下製造污染的廠商 S 不會考慮其對 F 造成的成本，導致無效率。矯正方法包括：課徵皮古稅（Pigouvian tax）使廠商面對正確的社會成本，但需知道正確稅率 t；或建立污染券（pollution vouchers）市場，允許廠商交易排放權，在最適時各廠商的邊際成本相等。財產權的指派會影響外部性的量與分配，但在效率上兩種指派可能同樣令人滿意（與 Coase 觀點呼應）。過度捕魚與共有地悲劇則說明個人依平均報酬而非邊際報酬決策所造成的過度使用。", "key_terms": [{"term_en": "Externality", "term_zh": "外部性", "def": "一方的消費或生產直接影響他方效用或生產，未經市場價格反映；分正外部性與負外部性。"}, {"term_en": "Consumption Externality", "term_zh": "消費外部性", "def": "當一消費者直接在意他人的消費或生產時所產生的外部性，如欣賞鄰居花園（正）或忍受噪音（負）。"}, {"term_en": "Pigouvian Tax", "term_zh": "皮古稅（污染稅）", "def": "對污染課稅 t 使廠商解 max p_s·s − c_s(s,x) − t·x，令稅率等於邊際外部成本，藉此矯正外部性；關鍵在於須知道正確的 t。"}, {"term_en": "Pollution Vouchers", "term_zh": "污染券", "def": "可交易的排放配額；透過市場交易，各廠商在最適時邊際成本相等，達到成本最小化的減排。"}, {"term_en": "Property Rights", "term_zh": "財產權", "def": "外部性的量取決於財產權的指派；不同指派有不同分配後果，但在效率上可能同樣令人滿意。"}, {"term_en": "Tragedy of the Commons", "term_zh": "共有地悲劇", "def": "個人依平均報酬 f(c)/c 而非邊際報酬決策，只要 f(c)>ac 就繼續進入，導致過度使用（如過度捕魚）。"}], "key_points": ["正外部性（欣賞鄰居花園）與負外部性（深夜噪音）皆為外部性；若涉及在意他人消費／生產則為消費外部性。", "外部性的量取決於財產權的指派；不同指派分配後果不同，但在效率上兩者可能同樣令人滿意。", "市場均衡下污染廠商 S 未考慮其對 F 的成本（∂c_f/∂x>0），造成無效率。", "皮古稅使廠商面對正確社會成本，t 應等於邊際外部成本；困難在於須知道正確的 t。", "污染券（可交易配額）在最適時使各廠商邊際成本相等；若 |c1'(y)|>p 則買進配額划算。", "村莊財富最大化應使邊際條件 f'(c)=a，但個人只看平均 f(c)/c≥a，故只要 f(c)>ac 就繼續進入，導致過度使用。", "過度捕魚是共有地悲劇的另一例。"], "flashcards": [{"q": "什麼是消費外部性（consumption externality）？", "a": "當一消費者直接在意另一行為者的消費或生產時所產生的外部性，例如欣賞鄰居花園（正）或忍受噪音（負）。"}, {"q": "財產權指派對外部性有何影響？", "a": "外部性的量取決於財產權的指派；不同指派有不同分配後果，但在效率上兩種指派可能同樣令人滿意。"}, {"q": "皮古稅（Pigouvian tax）如何矯正污染外部性？其困難為何？", "a": "課稅使廠商解 max p_s·s−c_s(s,x)−t·x，令 t 等於邊際外部成本；困難在於必須知道正確的稅率 t。"}, {"q": "污染券市場在最適時滿足什麼條件？", "a": "各廠商的邊際（減排）成本相等；廠商會比較自身邊際成本 |c1'(y)| 與配額價格 p 來決定買賣。"}, {"q": "共有地悲劇為何發生？", "a": "個人依平均報酬 f(c)/c≥a 而非邊際條件 f'(c)=a 決策，只要 f(c)>ac 就繼續進入，造成過度使用（如過度捕魚）。"}], "quiz": [{"q": "「深夜鄰居大聲放音樂讓我無法入睡」屬於下列何者？", "options": ["正外部性", "負外部性", "公共財", "皮古稅"], "answer": "負外部性", "explain": "課文以此為負外部性的例子（欣賞鄰居花園則為正外部性）。"}, {"q": "關於財產權指派與外部性，下列敘述何者正確？", "options": ["指派方式不影響外部性的量", "外部性的量取決於財產權指派，不同指派分配後果不同但效率上可能同樣滿意", "只有一種指派能達到效率", "財產權與外部性無關"], "answer": "外部性的量取決於財產權指派，不同指派分配後果不同但效率上可能同樣滿意", "explain": "課文比較 X 與 X'，A、B 各偏好不同，分配後果不同但兩者在效率上皆屬滿意。"}, {"q": "使用皮古稅矯正污染的主要實務困難是什麼？", "options": ["廠商不會反應稅", "必須知道正確的稅率 t", "稅一定造成無效率", "稅無法針對污染"], "answer": "必須知道正確的稅率 t", "explain": "課文明言關鍵在於設定使 t 等於邊際外部成本，但「我們必須知道正確的 t」。"}, {"q": "共有地悲劇（如過度捕魚）的根本原因是？", "options": ["個人依邊際報酬決策", "個人依平均報酬 f(c)/c 決策，只要 f(c)>ac 就進入，造成過度使用", "政府課稅過高", "財產權過度明確"], "answer": "個人依平均報酬 f(c)/c 決策，只要 f(c)>ac 就進入，造成過度使用", "explain": "課文對比社會最適的邊際條件 f'(c)=a 與個人所看的平均報酬，後者導致過度進入。"}]}, {"num": 37, "title_en": "Public Goods", "title_zh": "公共財", "summary": "本章探討公共財的提供。先以兩室友是否買電視（0-1 決策）為例：只要兩人願付金額 r1+r2≥c 即購買為 Pareto 效率，說明公共財的邊際願付應是各人邊際願付之「加總」。連續情形下 Pareto 效率條件為各人 MRS 之和等於邊際成本 Σ|MRS_{G,xi}|=c'(G)。由於個人自願提供會有搭便車問題，關鍵是如何誘出人們對公共財的真實偏好。Clarke-Groves（VCG）機制透過讓每個樞紐（pivotal）者繳交其對他人所造成外部性的稅（Clarke tax），使誠實成為最佳策略。一般化的 Groves 機制中，中心選擇使各人淨值加總最大的 x，並給每人一筆支付使其誠實報告為最佳。", "key_terms": [{"term_en": "Public Good", "term_zh": "公共財", "def": "可由多人共同消費的財貨（如電視）；其提供常涉及是否購買的集體決策與搭便車問題。"}, {"term_en": "Sum of MRS = MC Condition", "term_zh": "MRS 加總等於邊際成本條件", "def": "公共財 Pareto 效率條件：各人對公共財的邊際替代率之和等於邊際成本，Σ|MRS_{G,xi}|=c'(G)。"}, {"term_en": "Free Rider Problem", "term_zh": "搭便車問題", "def": "個人自願提供公共財時傾向少出，坐享他人提供，導致公共財供給不足，故須誘出真實偏好。"}, {"term_en": "Pivotal Agent", "term_zh": "樞紐個人", "def": "若少了某人的報告會改變集體決策結果，則該人是樞紐者，須為其對他人造成的外部性付稅。"}, {"term_en": "Clarke Tax / VCG Mechanism", "term_zh": "克拉克稅／VCG 機制", "def": "讓樞紐者繳交等於其對他人所造成外部性的稅，使誠實報告偏好成為最佳策略（honesty is the best policy）。"}, {"term_en": "Groves Mechanism", "term_zh": "格羅夫斯機制", "def": "中心選擇使各人淨值 Σn_j(x) 最大的 x，並給每人一筆與其報告無關第三項相抵的支付，使誠實為最適。"}], "key_points": ["0-1 買電視例：只要 r1+r2≥c 購買即 Pareto 效率，故公共財邊際願付應為各人邊際願付之加總。", "連續情形 Pareto 效率條件：Σ|MRS_{G,xi}|=c'(G)，即各人 MRS 之和等於邊際成本。", "直覺：增一單位 G，各人願放棄 |MRS| 元，社會須付 c'(G)，故 MRS 之和應等於邊際成本。", "個人自願提供有搭便車問題；核心問題是如何誘出人們對公共財的真實偏好。", "先分派成本 ci（Σci=100），再請各人報告價值 vi；若 Σvi≥100 則提供。", "以 ni=vi−ci 定義淨值；若某人為樞紐（其加入改變結果），須繳等於他對他人外部性的 Clarke 稅。", "在 Clarke／Groves 機制下，誠實報告偏好是最佳策略（honesty is the best policy）。"], "flashcards": [{"q": "公共財的 Pareto 效率條件（連續情形）為何？", "a": "各人對公共財的邊際替代率之和等於邊際成本：Σ|MRS_{G,xi}|=c'(G)。"}, {"q": "為何公共財的邊際願付要「加總」而非比較？", "a": "因公共財可共同消費；買電視例中只要 r1+r2≥c 即效率，故應加總各人邊際願付。"}, {"q": "什麼是搭便車問題（free rider problem）？", "a": "個人自願提供時傾向坐享他人提供而少出，導致供給不足，因此須設法誘出真實偏好。"}, {"q": "誰是樞紐個人（pivotal agent），他要付什麼稅？", "a": "若少了他的報告會改變集體決策，他即為樞紐者，須繳等於他對他人所造成外部性的 Clarke 稅。"}, {"q": "Clarke／VCG 機制的核心結論是什麼？", "a": "誠實報告自己的偏好是最佳策略（honesty is the best policy），因每人只需負責自己對他人的外部性。"}], "quiz": [{"q": "公共財達到 Pareto 效率的條件是什麼？", "options": ["各人 MRS 相等", "各人 MRS 之和等於邊際成本", "邊際成本等於平均成本", "各人願付相等"], "answer": "各人 MRS 之和等於邊際成本", "explain": "課文導出 Σ|MRS_{G,xi}|=c'(G)，因公共財可共享，需求須垂直加總。"}, {"q": "在兩室友買電視（成本 c）的 0-1 例子中，購買為 Pareto 效率的條件是？", "options": ["r1≥c 或 r2≥c", "r1+r2≥c", "r1=r2", "r1×r2≥c"], "answer": "r1+r2≥c", "explain": "只要兩人願付金額之和不小於成本，購買即 Pareto 效率，說明應加總邊際願付。"}, {"q": "在 Clarke 稅機制中，個人在何時須繳稅？", "options": ["任何時候都要繳", "當他是樞紐者（少了他會改變結果）時", "當他報告最高價值時", "永遠不用繳"], "answer": "當他是樞紐者（少了他會改變結果）時", "explain": "只有樞紐者對結果造成外部性，須繳等於該外部性的 Clarke 稅。"}, {"q": "Clarke／Groves 機制設計的目的與結論是什麼？", "options": ["使人隱藏偏好", "使誠實報告偏好成為最佳策略", "使公共財永不提供", "使成本平均分攤"], "answer": "使誠實報告偏好成為最佳策略", "explain": "課文反覆強調 honesty is the best policy——讓每人負責自己造成的外部性即可誘出真實偏好。"}]}, {"num": 38, "title_en": "Asymmetric Information", "title_zh": "資訊不對稱", "summary": "本章討論資訊不對稱。逆選擇（adverse selection）源於隱藏資訊：擁有私有資訊的一方，其交易決策以不利於未擁有資訊者的方式進行；例如保險市場中高風險者以低於實際風險的費率投保，使市場受影響。在主理人—代理人（principal-agent）問題中，若能觀察努力 x，主理人可直接解 max f(x)−c(x)−u，得 FOC：邊際產量等於邊際成本 MP(x*)=MC(x*)；同時須滿足使工人願意參與的個人理性（IR／參與）限制 s(f(x))−c(x)≥u。若無法觀察 x，還須滿足誘因相容（IC）限制，使代理人自願選擇所欲的努力水準。最後以 Grameen Bank（鄉村銀行）為例：村民彼此對信用有較佳資訊，也能相互監督與協助，藉此緩解資訊不對稱。", "key_terms": [{"term_en": "Adverse Selection", "term_zh": "逆選擇", "def": "擁有私有（隱藏）資訊者的交易決策，以不利於未擁有資訊之市場參與者的方式進行；如保險市場中高風險者以偏低費率投保。"}, {"term_en": "Hidden Information", "term_zh": "隱藏資訊", "def": "交易前一方擁有另一方不知的私有資訊，是逆選擇的來源。"}, {"term_en": "Principal-Agent Problem", "term_zh": "主理人—代理人問題", "def": "主理人設計報酬 s(f(x)) 以誘使代理人選擇努力 x；能否觀察 x 決定所需的限制條件。"}, {"term_en": "Individual Rationality (IR) / Participation Constraint", "term_zh": "個人理性（參與）限制", "def": "使代理人願意接受契約的條件：s(f(x))−c(x)≥u（保留效用）。"}, {"term_en": "Incentive Compatibility (IC) Constraint", "term_zh": "誘因相容限制", "def": "當努力不可觀察時所需的條件：s(f(x*))−c(x*)≥s(f(x))−c(x) 對所有 x 成立，使代理人自願選擇所欲努力水準。"}, {"term_en": "Grameen Bank", "term_zh": "鄉村銀行（葛拉敏銀行）", "def": "利用村民彼此對信用有較佳資訊、能相互監督與協助的機制，以緩解資訊不對稱下的借貸問題。"}], "key_points": ["逆選擇源於隱藏資訊：有私有資訊者的交易決策不利於未擁有資訊者。", "保險例：高風險者以低於實際風險的費率投保而得利，低風險者也得到比僅高風險者投保時更有利的保險。", "主理人—代理人問題須滿足使工人參與的個人理性（IR）限制：s(f(x))−c(x)≥u。", "若可觀察努力 x，主理人解 max f(x)−s(f(x)) s.t. IR，可化為 max f(x)−c(x)−u，FOC 為 MP(x*)=MC(x*)。", "若努力不可觀察，還須加上誘因相容（IC）限制：s(f(x*))−c(x*)≥s(f(x))−c(x)。", "Grameen Bank：村民對彼此信用有較佳資訊，能相互監督與協助，緩解資訊不對稱。"], "flashcards": [{"q": "逆選擇（adverse selection）如何定義？", "a": "擁有私有（隱藏）資訊的一方，其交易決策以不利於未擁有資訊之市場參與者的方式進行。"}, {"q": "在保險市場中逆選擇如何運作？", "a": "高風險者以低於實際風險的費率投保而得利；低風險者也得到比僅高風險者投保時更有利的保險。"}, {"q": "個人理性（IR／參與）限制的內容是什麼？", "a": "s(f(x))−c(x)≥u，即報酬減成本不小於保留效用，代理人才願意參與。"}, {"q": "當努力可觀察時，主理人問題的一階條件為何？", "a": "可化為 max f(x)−c(x)−u，FOC 為邊際產量等於邊際成本：MP(x*)=MC(x*)。"}, {"q": "誘因相容（IC）限制何時需要，內容為何？", "a": "當努力不可觀察時需要；要求 s(f(x*))−c(x*)≥s(f(x))−c(x) 對所有 x 成立。"}, {"q": "Grameen Bank 如何緩解資訊不對稱？", "a": "村民彼此對信用有較佳資訊，並能相互監督與協助，藉此降低借貸中的資訊問題。"}], "quiz": [{"q": "逆選擇（adverse selection）的根源是什麼？", "options": ["隱藏行動（道德風險）", "隱藏資訊", "外部性", "公共財"], "answer": "隱藏資訊", "explain": "課文明言逆選擇源於 hidden information——有私有資訊者的決策不利於未擁有資訊者。"}, {"q": "個人理性（IR／參與）限制的正確形式為何？", "options": ["s(f(x))−c(x)≥u", "MP(x)=MC(x)", "s(f(x*))−c(x*)≥s(f(x))−c(x)", "f(x)=c(x)"], "answer": "s(f(x))−c(x)≥u", "explain": "IR 限制確保代理人淨效用不低於保留效用 u，才願意參與。"}, {"q": "當努力 x 可被觀察時，主理人問題的一階條件為何？", "options": ["MP(x*)=0", "MP(x*)=MC(x*)", "s(f(x))=c(x)", "f(x*)=u"], "answer": "MP(x*)=MC(x*)", "explain": "可觀察時問題化為 max f(x)−c(x)−u，FOC 即邊際產量等於邊際成本。"}, {"q": "誘因相容（IC）限制在什麼情況下才必須納入？", "options": ["努力可被完全觀察時", "努力不可被觀察時", "報酬固定時", "沒有代理人時"], "answer": "努力不可被觀察時", "explain": "課文指出無法觀察 x 時，還須加上 IC 限制以確保代理人自願選擇所欲努力水準。"}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent).chapters;
const LS = 'micro_studied_v1';
let studied = JSON.parse(localStorage.getItem(LS)||'[]');

function saveStudied(){localStorage.setItem(LS,JSON.stringify(studied));updateProg();}
function updateProg(){document.getElementById('prog').textContent = studied.length+'/'+DATA.length+' 章';}

function renderHome(){
  const g=document.getElementById('chgrid');
  g.innerHTML = DATA.map(c=>`
    <div class="chcard ${studied.includes(c.num)?'studied':''}" onclick="openCh(${c.num})">
      <div class="n">CH ${c.num}</div>
      <div class="zh">${c.title_zh||''}</div>
      <div class="en">${c.title_en||''}</div>
      <div class="done">✓</div>
    </div>`).join('');
}

function openCh(num){
  const c = DATA.find(x=>x.num===num);
  if(!c) return;
  if(!studied.includes(num)){studied.push(num);saveStudied();}
  window.scrollTo(0,0);
  document.getElementById('home').classList.add('hidden');
  document.getElementById('detail').classList.remove('hidden');
  renderHome(); // refresh studied marks

  const terms = (c.key_terms||[]).map(t=>`
    <div class="term"><div class="t">${t.term_zh||''}<span class="en">${t.term_en||''}</span></div>
    <div class="d">${t.def||''}</div></div>`).join('');
  const points = (c.key_points||[]).map(p=>`<li>${p}</li>`).join('');

  const flash = (c.flashcards||[]).map((f,i)=>`
    <div class="fcwrap ${i===0?'':'hidden'}" data-fc="${num}">
      <div class="fc" onclick="this.classList.toggle('flip')">
        <div class="fcface fcfront">${f.q}</div>
        <div class="fcface fcback">${f.a}</div>
      </div>
      <div class="fchint">點卡片翻面看答案</div>
    </div>`).join('');

  const quiz = (c.quiz||[]).map((q,qi)=>`
    <div class="q">
      <div class="qq">Q${qi+1}. ${q.q}</div>
      ${q.options.map((o,oi)=>`<button class="opt" onclick="answer(this,${qi},${oi},${q.answer})">${String.fromCharCode(65+oi)}. ${o}</button>`).join('')}
      <div class="explain" id="ex_${num}_${qi}">💡 ${q.explain||''}</div>
    </div>`).join('');

  document.getElementById('detailBody').innerHTML = `
    <div style="margin-top:16px"><span class="n" style="color:var(--accent);font-size:12px;font-weight:700">CHAPTER ${c.num}</span>
      <h1 style="font-size:22px;margin:2px 0">${c.title_zh||''} <span style="font-size:14px;color:var(--muted);font-weight:500">${c.title_en||''}</span></h1></div>
    <h2 class="sec">重點摘要</h2>
    <div class="panel summary">${c.summary||''}</div>
    <h2 class="sec">關鍵重點</h2>
    <div class="panel"><ul class="points">${points}</ul></div>
    <h2 class="sec">關鍵定義 (${(c.key_terms||[]).length})</h2>
    ${terms}
    <h2 class="sec">記憶卡 (${(c.flashcards||[]).length})</h2>
    <div class="fcnav">
      <button onclick="fcMove(${num},-1)">‹</button>
      <div class="count" id="fccount_${num}">1 / ${(c.flashcards||[]).length}</div>
      <button onclick="fcMove(${num},1)">›</button>
    </div>
    <div id="fcbox_${num}">${flash}</div>
    <h2 class="sec">自我測驗 (${(c.quiz||[]).length})<span class="scoreBadge" id="score_${num}">0 / ${(c.quiz||[]).length}</span></h2>
    ${quiz}
  `;
  window['_fc_'+num]=0;
  window['_score_'+num]={correct:0,answered:{}};
}

function fcMove(num,dir){
  const box=document.getElementById('fcbox_'+num);
  const cards=box.querySelectorAll('.fcwrap');
  let i=window['_fc_'+num]||0;
  cards[i].classList.add('hidden');
  cards[i].querySelector('.fc').classList.remove('flip');
  i=(i+dir+cards.length)%cards.length;
  cards[i].classList.remove('hidden');
  window['_fc_'+num]=i;
  document.getElementById('fccount_'+num).textContent=(i+1)+' / '+cards.length;
}

function answer(btn,qi,oi,correct){
  const q=btn.closest('.q');
  if(q.dataset.done) return;
  q.dataset.done=1;
  const num=parseInt(document.querySelector('#detailBody .n').textContent.replace('CHAPTER',''));
  q.querySelectorAll('.opt').forEach((b,idx)=>{
    if(idx===correct)b.classList.add('correct');
    else if(idx===oi)b.classList.add('wrong');
    else b.classList.add('dim');
    b.style.pointerEvents='none';
  });
  document.getElementById('ex_'+num+'_'+qi).classList.add('show');
  const sc=window['_score_'+num];
  if(oi===correct){sc.correct++;}
  document.getElementById('score_'+num).textContent=sc.correct+' / '+DATA.find(x=>x.num===num).quiz.length;
}

function goHome(){
  window.scrollTo(0,0);
  document.getElementById('detail').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}

renderHome();updateProg();
</script>
</body>
</html>
