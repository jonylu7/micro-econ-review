.chip.essay{background:rgba(192,132,252,.15);color:var(--essay)}
.qtopic{font-size:12px;color:var(--muted)}
.qtext{font-size:15.5px;line-height:1.75;margin-bottom:12px;font-weight:500}
.ans{width:100%;min-height:120px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-size:14.5px;font-family:inherit;line-height:1.6;resize:vertical}

.btn-primary{background:var(--accent);color:#0b1020}

.hint{font-size:12px;color:var(--muted);margin-top:8px;display:none}

.footer{text-align:center;color:var(--muted);font-size:11px;padding:24px 0}

</head>

      "topic": "社會福利函數與公平配置",
      "type": "essay",
      "q": "課文比較功利主義 W=Σuᵢ 與 Rawls 式 W=min{u₁,…,uₙ} 兩種社會福利函數，並將公平配置（fair allocation）界定為同時具有效率與無嫉妒（envy-free）。請推理：(1) 若社會福利函數對每個人的效用都嚴格遞增，為何其最大化配置必具帕累托效率？(2) 兩種福利準則各隱含何種倫理判斷？(3) 無嫉妒與帕累托效率分別處理分配的哪一面向？"

    {
      "chapter": 35,
      "topic": "外部性與皮古稅",
      "type": "essay",
      "q": "設污染廠商的產量為 s，每單位產量伴隨一單位排放；其私人邊際成本為 PMC(s)，對下游造成的邊際外部損害為 MED(s)。請比較私人條件 p=PMC(s) 與社會條件 p=PMC(s)+MED(s)，推導每單位皮古稅（Pigouvian tax）應如何在社會最適排放量 s* 設為 t=MED(s*)。若產量與排放可分離，這個公式應如何改寫？最後說明估計邊際損害與選定正確稅率的實務困難。"

    },
    {
      "chapter": 37,
      "topic": "公共財效率條件與搭便車",

      "q": "在委託代理模型中，設努力 e 造成成本 c(e)，產出具有隨機性，契約依可觀察產出支付工資 w(y)。請比較努力可觀察與不可觀察兩種情況：前者如何直接指定努力並滿足參與限制（individual rationality, IR），後者為何還必須使代理人選擇目標努力，即滿足誘因相容限制（incentive compatibility, IC）。請以期望效用寫出 IR 與 IC 的一般形式，說明產出風險與風險趨避如何造成保險與誘因的取捨；最後討論團體連帶責任貸款如何利用同儕篩選與監督緩解逆選擇或道德風險。"

<script>
const QS = JSON.parse(document.getElementById('QDATA').textContent).questions;
const GRADE_PROMPT = `請你以一個大學部個體經濟學老師的立場評判以下問題與回答：
1. 請以經濟直覺、邏輯推導方面評斷
2. 不要過度延伸題目想受試者表達的方面
3. 以 0~5 分評斷
4. 並且最後提供評語，以及可能的修正方向的提點。`;

const LSKEY='micro_practice_ans_v1';
let saved = JSON.parse(localStorage.getItem(LSKEY)||'{}');
let filter='all';

function saveAns(i,v){saved[i]=v;localStorage.setItem(LSKEY,JSON.stringify(saved));}

function chapters(){const s=[...new Set(QS.map(q=>q.chapter))].sort((a,b)=>a-b);return s;}

function renderFilters(){
  const f=document.getElementById('filters');
  let html=`<div class="fbtn ${filter==='all'?'on':''}" onclick="setF('all')">全部</div>`;
  html+=`<div class="fbtn ${filter==='feynman'?'on':''}" onclick="setF('feynman')">費曼式</div>`;
  html+=`<div class="fbtn ${filter==='essay'?'on':''}" onclick="setF('essay')">申論式</div>`;
  chapters().forEach(c=>{html+=`<div class="fbtn ${filter==='ch'+c?'on':''}" onclick="setF('ch${c}')">Ch${c}</div>`;});
  f.innerHTML=html;
}
function setF(v){filter=v;renderFilters();renderList();window.scrollTo(0,0);}

function match(q){
  if(filter==='all')return true;
  if(filter==='feynman'||filter==='essay')return q.type===filter;
  if(filter.startsWith('ch'))return q.chapter===parseInt(filter.slice(2));
  return true;
}

function renderList(){
  const list=document.getElementById('list');
  const items=QS.map((q,i)=>({q,i})).filter(x=>match(x.q));
  document.getElementById('count').textContent=`顯示 ${items.length} 題`;
  list.innerHTML=items.map(({q,i})=>`
    <div class="qcard">
      <div class="qmeta">
        <span class="chip ch">CH ${q.chapter}</span>
        <span class="chip ${q.type}">${q.type==='feynman'?'費曼式':'申論式'}</span>
        <span class="qtopic">${q.topic||''}</span>
      </div>
      <div class="qtext">${q.q}</div>
      <textarea class="ans" id="ans_${i}" placeholder="在這裡寫下你的答案…" oninput="saveAns(${i},this.value)">${(saved[i]||'').replace(/</g,'&lt;')}</textarea>
      <div class="qactions">
        <button class="btn btn-primary" onclick="grade(${i})">產生評分 → 複製並開 ChatGPT</button>
        <button class="btn btn-ghost" onclick="copyOnly(${i})">只複製</button>
      </div>
      <div class="hint" id="hint_${i}">✅ 已複製到剪貼簿，正在開啟 ChatGPT，貼上（Ctrl/Cmd+V）即可</div>
    </div>`).join('');
}

function buildText(i){
  const q=QS[i];
  const ans=(document.getElementById('ans_'+i).value||'').trim();
  return `${GRADE_PROMPT}

【題目】（${q.type==='feynman'?'費曼式':'申論式'}・Varian 中階個經 第${q.chapter}章・${q.topic||''}）
${q.q}

【我的回答】
${ans||'（尚未作答）'}`;
}

async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}
  catch(e){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');document.body.removeChild(ta);return true;}
    catch(e2){document.body.removeChild(ta);return false;}
  }
}

async function grade(i){
  const t=buildText(i);
  await copyText(t);
  const h=document.getElementById('hint_'+i);h.classList.add('show');
  setTimeout(()=>{window.open('https://chatgpt.com/','_blank');},400);
}
async function copyOnly(i){
  const t=buildText(i);
  await copyText(t);
  const h=document.getElementById('hint_'+i);
  h.textContent='✅ 已複製到剪貼簿';h.classList.add('show');
}

renderFilters();renderList();
</script>
</body>
</html>
